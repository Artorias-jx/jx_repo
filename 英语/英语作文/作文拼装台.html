<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考研英语作文拼装台 · 英一</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --line2:#eef0f3;
  --ink:#1c2430; --ink2:#5b6675; --ink3:#8b95a3;
  --brand:#2f5fd0; --brand-bg:#eef3fe;
  --ok:#1f7a4d; --ok-bg:#e9f6ef;
  --warn:#a8641a; --warn-bg:#fdf3e3;
  --slot:#7b4bd0; --slot-bg:#f2ecfd;
  --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky; top:0; z-index:30;
  background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.top-row{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand span{color:var(--brand)}
.seg{display:inline-flex;background:var(--line2);border-radius:8px;padding:2px}
.seg button{
  border:0;background:transparent;padding:5px 14px;border-radius:6px;
  font-size:13px;color:var(--ink2);
}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 11px;font-size:13px;color:var(--ink2);
}
.btn:hover{border-color:#c9d0da;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#2852b8}
.btn:disabled{opacity:.4;cursor:not-allowed}
select{
  border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 9px;font-size:13px;color:var(--ink);max-width:270px;
}

/* 题型条 */
.typebar{
  display:flex;gap:6px;padding:9px 16px;overflow-x:auto;
  border-bottom:1px solid var(--line);background:#fff;
}
.tbtn{
  white-space:nowrap;border:1px solid var(--line);background:#fff;
  border-radius:20px;padding:4px 13px;font-size:13px;color:var(--ink2);
}
.tbtn small{display:block;font-size:10px;color:var(--ink3);line-height:1.1}
.tbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tbtn.on small{color:#c8d7f8}

/* 开关条 */
.flagbar{
  display:flex;gap:16px;align-items:center;padding:7px 16px;
  border-bottom:1px solid var(--line);background:#fbfcfd;font-size:12.5px;color:var(--ink2);
  flex-wrap:wrap;
}
.flagbar label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.flagbar input{accent-color:var(--brand);margin:0}

/* ---------- 布局 ---------- */
.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0;align-items:start}
@media(max-width:960px){.main{grid-template-columns:1fr}}

.editor{padding:16px;min-width:0}
.previewwrap{
  position:sticky;top:96px;height:calc(100vh - 96px);
  display:flex;flex-direction:column;border-left:1px solid var(--line);
  background:#fff;
}
@media(max-width:960px){
  .previewwrap{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
}

.sec{margin-bottom:20px}
.sec-head{
  display:flex;align-items:baseline;gap:9px;margin:0 0 9px;
  padding-bottom:6px;border-bottom:1px dashed var(--line);
}
.sec-head h2{font-size:13.5px;margin:0;letter-spacing:.3px}
.sec-head em{font-style:normal;font-size:11.5px;color:var(--ink3)}

.sent{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 11px;margin-bottom:9px;transition:border-color .15s;
}
.sent:hover{border-color:#cfd6e0}
.sent-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sent-id{
  font-size:10.5px;font-weight:700;color:#fff;background:var(--ink3);
  border-radius:5px;padding:1px 6px;letter-spacing:.4px;
}
.sent-title{font-size:12px;color:var(--ink2)}
.sent-head select{
  margin-left:auto;font-size:12px;padding:2px 6px;border-radius:6px;max-width:58%;
}
.sent-body{font-size:14.5px;line-height:1.85;color:var(--ink);word-break:break-word}
.sent-body .txt{white-space:pre-wrap}

/* 槽位 */
.slot{
  border:0;border-bottom:1.5px dashed var(--slot);background:var(--slot-bg);
  color:var(--slot);border-radius:4px 4px 0 0;padding:0 3px;margin:0 1px;
  font:inherit;font-size:14px;line-height:inherit;transition:background .12s;
}
.slot:hover{background:#e6d9fb}
.slot.filled{
  border-bottom-style:solid;border-bottom-color:transparent;
  background:var(--ok-bg);color:var(--ok);border-radius:4px;
}
.slot.empty::after{content:"";}
.slot .tag{font-size:.86em;opacity:.9}
body.nohl .slot{background:transparent;border-bottom-color:#c8ccd4;color:inherit}
body.nohl .slot.filled{color:inherit;border-bottom-color:transparent;background:transparent}

/* 预览 */
.pv-head{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.pv-head strong{font-size:13px}
.pv-count{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pv-body{flex:1;overflow:auto;padding:16px 18px 40px}
.pv-paper{
  font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.95;
  color:#16202c;max-width:640px;
}
.pv-paper p{margin:0 0 14px;text-indent:2em;white-space:pre-line}
.pv-paper p.plain{text-indent:0}
.pv-paper .zh{
  display:block;text-indent:2em;font-family:inherit;font-size:12.5px;
  line-height:1.7;color:var(--ink3);margin-top:4px;
}
.pv-paper .zh::before{content:"〔译〕";opacity:.55;margin-right:2px}
.pv-empty{color:var(--ink3);font-size:13px;text-align:center;padding:40px 0}

/* 弹层 */
.pop{
  position:fixed;z-index:60;width:340px;max-width:calc(100vw - 24px);
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 34px rgba(18,28,45,.18);padding:10px;display:none;
}
.pop.open{display:block}
.pop-top{display:flex;gap:6px;margin-bottom:8px}
.pop-in{
  flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;
}
.pop-in:focus{outline:2px solid var(--brand-bg);border-color:var(--brand)}
.pop-x{border:0;background:transparent;color:var(--ink3);font-size:16px;padding:0 4px}
.pop-label{font-size:11px;color:var(--ink3);margin:0 0 6px;display:flex;justify-content:space-between}
.pop-list{max-height:250px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.opt{
  text-align:left;border:1px solid var(--line2);background:#fff;border-radius:8px;
  padding:6px 9px;font-size:12.5px;line-height:1.5;
}
.opt:hover{background:var(--brand-bg);border-color:#c7d8f8}
.opt.on{border-color:var(--brand);background:var(--brand-bg)}
.opt b{display:block;font-weight:600;color:var(--ink);font-family:var(--mono);font-size:12px}
.opt i{display:block;font-style:normal;color:var(--ink3);font-size:11.5px;margin-top:1px}
.opt .from{color:var(--warn);font-size:10.5px}

/* 提示 */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
  background:#1c2430;color:#fff;font-size:12.5px;padding:7px 15px;border-radius:20px;
  opacity:0;pointer-events:none;transition:all .22s;z-index:80;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">考研英语作文<span>拼装台</span></div>
    <div class="seg" id="tabSeg">
      <button data-tab="big" class="on">大作文</button>
      <button data-tab="small">小作文</button>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <select id="presetSel" title="载入真题预设"></select>
      <button class="btn" id="btnUndo" title="撤销上一步">撤销</button>
      <button class="btn" id="btnReset" title="清空当前篇">重置</button>
      <button class="btn primary" id="btnCopy">复制全文</button>
    </div>
  </div>
  <div class="typebar" id="typeBar"></div>
  <div class="flagbar">
    <label><input type="checkbox" id="fZh" checked> 中英对照</label>
    <label><input type="checkbox" id="fLite"> 考场精简</label>
    <label><input type="checkbox" id="fHl" checked> 高亮槽位</label>
    <span class="spacer"></span>
    <span id="wordCount" class="pv-count">0 词</span>
  </div>
</header>

<div class="main">
  <section class="editor" id="editor"></section>
  <aside class="previewwrap">
    <div class="pv-head">
      <strong>全文预览</strong>
      <span class="pv-count" id="pvMeta"></span>
      <span class="spacer"></span>
      <button class="btn" id="btnCopy2">复制</button>
    </div>
    <div class="pv-body"><div class="pv-paper" id="paper"></div></div>
  </aside>
</div>

<div class="pop" id="pop">
  <div class="pop-top">
    <input class="pop-in" id="popIn" placeholder="也可直接手输…">
    <button class="pop-x" id="popX" title="关闭">✕</button>
  </div>
  <p class="pop-label"><span id="popName"></span><span id="popHint"></span></p>
  <div class="pop-list" id="popList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* =========================================================
   0. 工具
   ========================================================= */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
/* 槽位选项：'英文|中文|pl'  第三段写 pl 表示复数 */
function O(str){
  var p = String(str).split('|');
  return { en:p[0], zh:p[1]||p[0], pl:p[2]==='pl', note:p[3]||'' };
}
function opts(){
  var out=[], i;
  for(i=0;i<arguments.length;i++){
    var a = arguments[i];
    if(typeof a === 'string'){ out.push(O(a)); }
    else { for(var j=0;j<a.length;j++){ out.push(O(a[j])); } }
  }
  return out;
}

/* =========================================================
   1. 词库
   ========================================================= */
var LIB = {
  chart: opts('table|表格','bar chart|柱状图','line chart|折线图','pie chart|饼图','two charts|两张图'),
  chartCap: opts('table|表格','bar chart|柱状图','line chart|折线图','pie chart|饼图'),
  verbUp: opts('surged|激增','rose|上升','climbed|攀升','soared|飙升','grew|增长','jumped|跃升','expanded|扩张','mounted|增加'),
  verbDown: opts('fell|下降','declined|下滑','dropped|跌落','shrank|收缩','dipped|小幅下降','plummeted|暴跌'),
  verbStay: opts('remained stable|保持稳定','stood at|维持在','stabilized|趋于稳定','leveled off|趋于平缓'),
  verbUpN: opts('a surge|激增','a rise|上升','a climb|攀升','a jump|跃升','an increase|增长'),
  verbDownN: opts('a decline|下滑','a drop|下降','a fall|回落','a shrink|收缩'),
  degree: opts('dramatically|急剧地','sharply|大幅地','markedly|显著地','notably|明显地','remarkably|惊人地','significantly|显著地','substantially|大幅地','steadily|稳步地','gradually|逐渐地','modestly|温和地','marginally|小幅地','slightly|略微'),
  share: opts('proportion|比例','percentage|百分比','share|份额','ratio|比率'),
  figure: opts('figure|数字','number|数量','volume|总量','amount|数额'),
  year: opts('2014|2014','2020|2020','2023|2023','2012|2012','2021|2021','2018|2018','2022|2022'),
  data: opts('75.2|75.2','145.9|145.9','83.7|83.7','98.2|98.2','39.3%|39.3%','46.3%|46.3%','406|406','670|670','8.8%|8.8%','25.4%|25.4%'),
  // 王晶婷 6 维语料（名词短语）
  topicPersonal: opts('self-discipline and time management|自律与时间管理','interdisciplinary knowledge|跨学科知识','perseverance and resilience|毅力与韧性','hands-on ability and practical skills|动手实践能力','critical and independent thinking|批判与独立思考'),
  topicTech: opts('elderly-care robots|养老机器人','major durable consumer goods|主要耐用消费品','smart home appliances|智能家电','technological advancement|技术进步','artificial intelligence|人工智能'),
  topicSociety: opts('urban infrastructure construction|城市基础设施建设','public recreational facilities|公共休闲设施','an increasingly aging society|日益老龄化的社会','people\'s disposable income|居民可支配收入'),
  topicCulture: opts('time-honored traditional culture|悠久的传统文化','cultural heritage and folk customs|文化遗产与民俗','family values and traditions|家风与家庭传统','cross-cultural communication|跨文化交流'),
  topicEco: opts('public environmental awareness|公众环保意识','sustainable development strategy|可持续发展战略','an eco-friendly and low-carbon lifestyle|绿色低碳生活方式','uncivilized behaviors in public|公共场所不文明行为'),
  topicFamily: opts('filial piety and gratitude|孝道与感恩','parent-child interaction and bonding|亲子互动与纽带','the power of role models|榜样的力量','mutual understanding and collaboration|相互理解与协作'),
  // 王晶婷 动宾搭配
  colloPersonal: opts('step out of one\'s comfort zone|走出舒适区','broaden one\'s horizons and enrich experience|拓宽视野、丰富经验','cultivate critical and independent thinking|培养批判与独立思维','secure a competitive edge in the job market|获得就业竞争优势'),
  colloTech: opts('improve work and communication efficiency|提高工作与沟通效率','relieve the burden of household chores and care|减轻家务与照护负担','ensure safety standards and data privacy|保障安全标准与数据隐私','bridge the digital divide for seniors|为老年人弥合数字鸿沟'),
  colloSociety: opts('enhance residents\' sense of happiness and gain|提升居民幸福感与获得感','shift from basic material needs to spiritual pursuits|从物质需求转向精神追求','allocate more funds to public services|向公共服务投入更多资金','narrow the urban-rural gap|缩小城乡差距'),
  colloCulture: opts('keep traditional virtues alive|让传统美德延续活力','strengthen cultural confidence and identity|增强文化自信与认同','absorb the essence and discard the dross|取其精华、去其糟粕','foster community pride and cohesion|培养社区自豪感与凝聚力'),
  colloEco: opts('maintain ecological balance|维持生态平衡','tarnish the beauty of nature|破坏自然美景','prioritize immediate convenience over long-term interests|重眼前便利、轻长远利益','establish a comprehensive supervision mechanism|建立全面监管机制'),
  colloFamily: opts('teach by example rather than verbal instruction|言传不如身教','offer emotional companionship to aging parents|为年迈父母提供情感陪伴','foster a harmonious family atmosphere|营造和谐家庭氛围','bridge the generation gap|弥合代沟')
};

/* =========================================================
   2. 句式库
   结构：{id, name, note, sent:[{label,title,opts:[{t,zh,s}]}]}
   槽位语法：{name}   /   {@ag:name|单数|复数}
   s 里定义该句所有槽位的候选词
   ========================================================= */

/* ---------- 大作文 · 第一段 ---------- */
var P1 = {

picture_single: [
  { label:'句1', title:'总体描述', opts:[
    { t:'As is vividly depicted in the cartoon above, {scene}.',
      zh:'正如上图生动描绘的，{scene}。',
      s:{ scene: opts(
        'two climbers are making their way to the top of a mountain|两名登山者正朝山顶进发（2019 爬山）',

        'a group of young people are rowing a dragon boat|一群年轻人正在划龙舟（2023 龙舟）',
        'a father and a son are reading in a study|父子二人在书房读书（2017 读书）',
        'a river in a scenic area is littered with garbage left by tourists|景区河流被游客丢满垃圾（2011）',
        'a student is watching a traditional opera with a confused look|一名学生一脸困惑地看着传统戏曲（2021）',
        'four friends are sitting around a table, each staring at a phone|四个朋友围坐一桌，各自盯着手机（2015）'
      )}},
    { t:'{Verb} {place} {@ag:people|is|are} {people}, {act}.',
      zh:'{place}，{people} 正 {act}。',
      s:{
        Verb: opts('Standing|站着','Seated|坐着','Waiting|等候着'),
        place: opts('in front of the bulletin board|在公告栏前','at the desk|在书桌旁','beside the notice|在告示旁','on the platform|在站台上'),
        people: opts('a college student|一名大学生|sg','two graduates|两名毕业生|pl','a group of tourists|一群游客|pl'),
        act: opts('gazing at the notice with a hesitant expression|带着犹豫的神情盯着告示','discussing a campus lecture|讨论一场校园讲座','waiting for the early train|等候早班车')
      }},
    { t:'The picture above presents a striking contrast between {group1} and {group2}.',
      zh:'上图呈现出 {group1} 与 {group2} 的鲜明对比。',
      s:{

      }}
  ]},
  { label:'句2', title:'细节（动作 / 对话）', opts:[

      s:{
        p1: opts('climber|登山者','student|学生','tourist|游客'),
        a1: opts('sitting on a stone step in frustration|沮丧地坐在石阶上','glancing at the notice|瞥了一眼告示','wiping sweat from his forehead|擦着额头的汗'),
        line1: opts('I can not go any further|我实在走不动了','This course is too hard for me|这门课对我来说太难了','Climbing is exhausting|爬山太累了'),

    { t:'{p1} is {a1}, while {p2} {a2}.',
      zh:'{p1} 正{a1}，而{p2}则{a2}。',
      s:{
        p1: opts('The young man|年轻人','The student on the left|左边的学生','The tourist at the bow|船头的游客','The student in the front row|前排的学生'),
        a1: opts('reclining lazily in a chair|懒散地瘫在椅子里','staring at his phone|盯着手机','casually throwing garbage into the water|随手把垃圾扔进水里','staring at the stage in confusion|困惑地盯着舞台'),
        p2: opts('his roommate|他的室友','the girl beside him|他身旁的女孩','his companions on the boat|船上的同伴','his classmates|他的同学们'),

      }},
    { t:'In the left picture, {p1} is {a1}. By contrast, the right one captures {p2} {a2}.',

      s:{
        p1: opts('a young man|一个年轻人','a student|一名学生'),
        a1: opts('watching TV with snacks in hand|手拿零食看电视','lying in bed and scrolling|躺在床上刷手机'),
        p2: opts('his classmate|他的同学','another boy|另一个男孩'),
        a2: opts('setting a clear goal to finish twenty books|定下读完二十本书的明确目标','working out a detailed study plan|制定详细的学习计划')
      }}
  ]},
  { label:'句3', title:'字幕 / 点题', opts:[
    { t:'Below the drawing, the caption reads, "{caption}".',
      zh:'图下文字写道："{caption}"。',

/* =========================================================
   4. 状态
   ========================================================= */
var LS_KEY = 'essay_bench_v1';
var state = {
  tab:'big',
  type:'picture_single',
  smallType:'letter',
  variants:{},
  skip:{},
  values:{},
  flags:{ zh:true, lite:false, hl:true }
};
var undoStack = [];

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function currentSections(){
  if(state.tab === 'big'){
    var t = BIG_TYPES.filter(function(x){return x.id===state.type;})[0] || BIG_TYPES[0];
    return [
      { key:'p1', name:'第一段 · 描述', note:'按题型分流', sents:t.p1 },
      { key:'p2', name:'第二段 · 论证', note:'四条路径选一', sents:P2[state.path||'A'] },
      { key:'p3', name:'第三段 · 收尾', note:'总结 + 措施 + 升华', sents:P3 }
    ];
  }
  return [{ key:'s1', name:'小作文 · A 节', note:'8 句 / 6 句', sents:SMALL[state.smallType] }];
}

/* 取某句的当前方案（-1 表示本句省略） */
function variantOf(secKey, idx){
  var k = secKey + '.' + idx;
  if(state.skip[k]) return -1;
  var v = state.variants[k];
  var list = currentSections().filter(function(s){return s.key===secKey;})[0].sents[idx].opts;
  if(typeof v !== 'number' || v < 0 || v >= list.length) v = 0;
  return v;
}

function valKey(secKey, idx, slot){ return secKey + '.' + idx + '.' + slot; }

function getVal(secKey, idx, slot){
  var k = valKey(secKey, idx, slot);
  return state.values[k];
}
function setVal(secKey, idx, slot, v){
  var k = valKey(secKey, idx, slot);
  if(v === '' || v == null){ delete state.values[k]; }
  else { state.values[k] = v; }
}

/* 槽位定义（从当前方案里取） */
function slotDefs(secKey, idx){
  var vi = variantOf(secKey, idx);
  if(vi < 0) return {};
  var sec = currentSections().filter(function(s){return s.key===secKey;})[0];
  var o = sec.sents[idx].opts[vi];
  return o.s || {};
}

/* =========================================================
   5. 渲染句子
   ========================================================= */
function tokenize(tpl){
  var out=[], re=/\{([^{}]+)\}/g, last=0, m;
  while((m = re.exec(tpl))){
    if(m.index > last) out.push({type:'t', v:tpl.slice(last, m.index)});
    var inner = m[1];
    if(inner.indexOf('@ag:') === 0){
      var p = inner.slice(4).split('|');
      out.push({type:'ag', slot:p[0], sg:p[1]||'', pl:p[2]||''});
    } else {
      out.push({type:'s', slot:inner});
    }
    last = m.index + m[0].length;
  }
  if(last < tpl.length) out.push({type:'t', v:tpl.slice(last)});
  return out;
}

function isPlural(secKey, idx, slot){
  var def = slotDefs(secKey, idx)[slot];
  if(!def || !def.length) return false;
  var cur = getVal(secKey, idx, slot);
  var hit = null;
  for(var i=0;i<def.length;i++){ if(def[i].en === cur){ hit = def[i]; break; } }
  if(!hit) hit = def[0];
  return !!hit.pl;
}

/* 生成 HTML（槽位可点） */
function renderHTML(secKey, idx){
  var vi = variantOf(secKey, idx);
  if(vi < 0) return '<span class="txt" style="color:#8b95a3">（本句已省略）</span>';
  var tpl = currentSections().filter(function(s){return s.key===secKey;})[0].sents[idx].opts[vi].t;
  var toks = tokenize(tpl), out='', i, t;
  for(i=0;i<toks.length;i++){
    t = toks[i];
    if(t.type === 't'){ out += esc(t.v); }
    else if(t.type === 'ag'){
      var plural = isPlural(secKey, idx, t.slot);
      out += '<span class="txt">'+esc(plural ? t.pl : t.sg)+'</span>';
    } else {
      var v = getVal(secKey, idx, t.slot);
      var def = slotDefs(secKey, idx)[t.slot] || [];
      var cls = 'slot ' + (v ? 'filled' : '');
      var label = v ? esc(v) : '【' + esc(t.slot) + '】';
      out += '<button type="button" class="'+cls+'" data-sec="'+secKey+'" data-idx="'+idx+'" data-slot="'+esc(t.slot)+'">'+label+'</button>';
    }
  }
  return out;
}

/* 生成纯文本（带词形处理） */
function polish(str){
  var proper = /^(I|China|Chinese|Li|Ming|Paul|Jack|Smith|Cook|Great|Wall|City|Museum|Students|Union|December|June|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|English|Internet|Wall)$/;
  var s = str;
  s = s.replace(/\s+([,.;:!?])/g, '$1');
  s = s.replace(/\s{2,}/g, ' ');
  /* 逗号/分号后小写（跳过专有名词） */
  s = s.replace(/([,;])\s+([A-Z][A-Za-z']*)/g, function(m0, p, w){
    if(proper.test(w)) return m0;
    return p + ' ' + w.charAt(0).toLowerCase() + w.slice(1);
  });
  /* 句首大写 */
  s = s.replace(/^(\s*)([a-z])/, function(m0, a, b){ return a + b.toUpperCase(); });
  return s;
}

function renderText(secKey, idx, zhMode){
  var vi = variantOf(secKey, idx);
  if(vi < 0) return '';
  var sec = currentSections().filter(function(s){return s.key===secKey;})[0];
  var o = sec.sents[idx].opts[vi];
  var tpl = zhMode ? (o.zh || o.t) : o.t;
  var toks = tokenize(tpl), out='', i;
  for(i=0;i<toks.length;i++){
    var t = toks[i];
    if(t.type === 't'){ out += t.v; }
    else if(t.type === 'ag'){
      out += isPlural(secKey, idx, t.slot) ? t.pl : t.sg;
    } else {
      var v = getVal(secKey, idx, t.slot);
      if(v){
        if(zhMode){
          var def = slotDefs(secKey, idx)[t.slot] || [];
          var hit = null;
          for(var j=0;j<def.length;j++){ if(def[j].en === v){ hit = def[j]; break; } }
          out += hit ? hit.zh : v;
        } else {
          out += v;
        }
      } else {
        out += '【' + t.slot + '】';
      }
    }
  }
  return zhMode ? out : polish(out);
}

var editor = $('#editor');

function buildEditor(){
  editor.innerHTML = '';
  var secs = currentSections();
  secs.forEach(function(sec){
    var wrap = document.createElement('div');
    wrap.className = 'sec';
    var h = document.createElement('div');
    h.className = 'sec-head';
    h.innerHTML = '<h2>'+esc(sec.name)+'</h2><em>'+esc(sec.note)+(state.tab==='big'&&sec.key==='p2'?(' · 当前路径 '+ (state.path||'A')):'')+'</em>';
    /* 第二段加路径切换 */
    if(state.tab === 'big' && sec.key === 'p2'){
      var sel = document.createElement('select');
      [['A','路径A · 个人品质'],['B','路径B · 积极趋势'],['C1','路径C1 · 科技双刃剑'],['C2','路径C2 · 消极问题']].forEach(function(p){
        var op = document.createElement('option');
        op.value = p[0]; op.textContent = p[1];
        if((state.path||'A') === p[0]) op.selected = true;
        sel.appendChild(op);
      });
      sel.style.marginLeft = 'auto';
      sel.addEventListener('change', function(){
        snapshot();
        state.path = sel.value;
        save(); buildEditor(); renderPreview();
      });
      h.appendChild(sel);
    }
    wrap.appendChild(h);

    sec.sents.forEach(function(sent, idx){
      wrap.appendChild(buildSent(sec.key, idx, sent));
    });
    editor.appendChild(wrap);
  });
}

function buildSent(secKey, idx, sent){
  var box = document.createElement('div');
  box.className = 'sent';

  var head = document.createElement('div');
  head.className = 'sent-head';

  var id = document.createElement('span');
  id.className = 'sent-id';
  id.textContent = sent.label || ('句' + (idx+1));

  var ti = document.createElement('span');
  ti.className = 'sent-title';
  ti.textContent = sent.title || '';

  head.appendChild(id);
  head.appendChild(ti);

  var sel = document.createElement('select');
  sent.opts.forEach(function(o, i){
    var op = document.createElement('option');
    op.value = String(i);
    op.textContent = '方案 ' + (i+1) + (o.zh ? ' · ' + o.zh.slice(0, 16) : '');
    sel.appendChild(op);
  });
  if(!sent.fixed){
    var skipOp = document.createElement('option');
    skipOp.value = '-1';
    skipOp.textContent = '— 省略此句 —';
    sel.appendChild(skipOp);
  }
  sel.value = String(variantOf(secKey, idx));
  sel.addEventListener('change', function(){
    snapshot();
    var v = parseInt(sel.value, 10);
    var k = secKey + '.' + idx;
    if(v < 0){ state.skip[k] = true; }
    else { delete state.skip[k]; state.variants[k] = v; }
    save(); buildEditor(); renderPreview();
  });
  head.appendChild(sel);

  var body = document.createElement('div');
  body.className = 'sent-body';
  body.innerHTML = renderHTML(secKey, idx);

  body.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.slot') : null;
    if(b) openPop(b.dataset.sec, parseInt(b.dataset.idx,10), b.dataset.slot, b);
  });

  box.appendChild(head);
  box.appendChild(body);
  return box;
}

/* =========================================================
   7. 槽位弹层
   ========================================================= */
var pop = $('#pop'), popList = $('#popList'), popIn = $('#popIn'),
    popName = $('#popName'), popHint = $('#popHint');
var popCtx = null;

function openPop(secKey, idx, slot, anchor){
  popCtx = { sec:secKey, idx:idx, slot:slot };
  var def = slotDefs(secKey, idx)[slot] || [];
  var cur = getVal(secKey, idx, slot);
  popName.textContent = '槽位：' + slot;
  popHint.textContent = def.length ? (def.length + ' 个候选') : '可自由输入';
  popIn.value = cur || '';
  popList.innerHTML = '';

  def.forEach(function(o){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (cur === o.en ? ' on' : '');
    b.innerHTML = '<b>'+esc(o.en)+'</b><i>'+esc(o.zh)+'</i>';
    b.addEventListener('click', function(){
      snapshot();
      setVal(secKey, idx, slot, o.en);
      save(); closePop(); buildEditor(); renderPreview();
    });
    popList.appendChild(b);
  });

  /* 定位 */
  var r = anchor.getBoundingClientRect();
  pop.classList.add('open');
  var w = pop.offsetWidth, h = pop.offsetHeight;
  var x = Math.min(Math.max(8, r.left - 20), window.innerWidth - w - 8);
  var y = r.bottom + 8;
  if(y + h > window.innerHeight - 8) y = Math.max(8, r.top - h - 8);
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
  popIn.focus();
  popIn.select();
}

function closePop(){ pop.classList.remove('open'); popCtx = null; }

popIn.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && popCtx){
    e.preventDefault();
    snapshot();
    setVal(popCtx.sec, popCtx.idx, popCtx.slot, popIn.value.trim());
    save(); closePop(); buildEditor(); renderPreview();
  }
  if(e.key === 'Escape'){ closePop(); }
});
$('#popX').addEventListener('click', closePop);
document.addEventListener('mousedown', function(e){
  if(pop.classList.contains('open') && !pop.contains(e.target) && !e.target.closest('.slot')) closePop();
});

/* =========================================================
   8. 预览
   ========================================================= */
function renderPreview(){
  var secs = currentSections();
  var paper = $('#paper');
  var zhOn = state.flags.zh, lite = state.flags.lite;
  var allText = '', html = '', words = 0;

  secs.forEach(function(sec){
    var blocks = [[]];
    sec.sents.forEach(function(sent, idx){
      var en = renderText(sec.key, idx, false);
      var zh = renderText(sec.key, idx, true);
      if(!en.replace(/\s/g,'')) return;
      allText += en + ' ';
      words += countWords(en.replace(/【[^】]*】/g, ''));
      if(sent.br){
        if(blocks[blocks.length-1].length) blocks.push([]);
        blocks[blocks.length-1].push({en:en, zh:'', br:true});
        blocks.push([]);
      } else {
        blocks[blocks.length-1].push({en:en, zh:zh, br:false});
      }
    });

    blocks.forEach(function(b){
      if(!b.length) return;
      if(lite){
        html += '<p>' + esc(b.map(function(x){return x.en;}).join(' ')) + '</p>';
        return;
      }
      if(b.length === 1 && b[0].br){
        html += '<p class="plain">' + esc(b[0].en) + '</p>';
      } else {
        var en2 = b.map(function(x){return x.en;}).join(' ');
        var zh2 = b.map(function(x){return x.zh;}).join(' ');
        html += '<p>' + esc(en2) + (zhOn && zh2 ? '<span class="zh">' + esc(zh2) + '</span>' : '') + '</p>';
      }
    });
  });

  if(!allText.trim() || Object.keys(state.values).length === 0){
    paper.innerHTML = '<div class="pv-empty">从顶部「载入真题预设」开始，<br>或直接点左侧任意【槽位】逐句拼装。</div>';
  } else {
    paper.innerHTML = html;
  }
  $('#wordCount').textContent = words + ' 词';
  $('#pvMeta').textContent = state.tab === 'big'
    ? (words + ' 词 / 建议 175–195')
    : (words + ' 词 / 建议 100–112');
  document.body.classList.toggle('nohl', !state.flags.hl);
}

function applyPreset(p){
  snapshot();
  state.tab = p.tab;
  if(p.tab === 'big'){ state.type = p.type; state.path = p.path || 'A'; }
  else { state.smallType = p.smallType || 'letter'; }
  state.variants = clone(p.v || {});
  state.skip = clone(p.skip || {});
  state.values = clone(p.vals || {});
  save(); buildAll();
  toast('已载入：' + p.name);
}

/* =========================================================
   10. 顶栏 / 事件
   ========================================================= */
function buildTypeBar(){
  var bar = $('#typeBar');
  bar.innerHTML = '';
  var list = state.tab === 'big' ? BIG_TYPES : SMALL_TYPES;
  list.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'tbtn' + ((state.tab==='big'?state.type:state.smallType) === t.id ? ' on' : '');
    b.innerHTML = esc(t.name) + '<small>' + esc(t.sub) + '</small>';
    b.addEventListener('click', function(){
      snapshot();
      if(state.tab === 'big') state.type = t.id; else state.smallType = t.id;
      save(); buildAll();
    });
    bar.appendChild(b);
  });
}

function buildPresetSel(){
  var s = $('#presetSel');
  s.innerHTML = '<option value="">载入真题预设…</option>';
  PRESETS.forEach(function(p){
    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    s.appendChild(o);
  });
  s.onchange = function(){
    if(!s.value) return;
    var p = PRESETS.filter(function(x){return x.id===s.value;})[0];
    if(p) applyPreset(p);
    s.value = '';
  };
}

function snapshot(){
  undoStack.push(JSON.stringify({v:state.variants, k:state.skip, s:state.values, t:state.type, st:state.smallType, tb:state.tab, p:state.path}));
  if(undoStack.length > 30) undoStack.shift();
  updateUndoBtn();
}
function updateUndoBtn(){ $('#btnUndo').disabled = undoStack.length === 0; }

function undo(){
  if(!undoStack.length) return;
  var s = JSON.parse(undoStack.pop());
  state.variants = s.v; state.skip = s.k || {}; state.values = s.s; state.type = s.t;
  state.smallType = s.st; state.tab = s.tb; state.path = s.p;
  save(); buildAll(); updateUndoBtn();
  toast('已撤销');
}

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({ state:state })); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(o && o.state){
      var s = o.state;
      state.tab = s.tab || 'big';
      state.type = s.type || 'picture_single';
      state.smallType = s.smallType || 'letter';
      state.path = s.path || 'A';
      state.variants = s.variants || {};
      state.skip = s.skip || {};
      state.values = s.values || {};
      state.flags = s.flags || state.flags;
    }
  }catch(e){}
}

var toastTimer = null;
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
}

function copyAll(){
  var text = collectText();
  if(!text.trim()){ toast('还没有内容'); return; }
  var done = function(){ toast('已复制 ' + text.length + ' 字符，' + countWords(text) + ' 词'); };
  var fail = function(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else { fail(); }
}

function countWords(t){ return (t.match(/[A-Za-z][A-Za-z'\-]*/g) || []).length; }

function collectText(){
  var secs = currentSections(), out = [];
  secs.forEach(function(sec){
    var blocks = [[]];
    sec.sents.forEach(function(sent, idx){
      var en = renderText(sec.key, idx, false);
      if(!en.replace(/\s/g,'')) return;
      if(sent.br){
        if(blocks[blocks.length-1].length) blocks.push([]);
        blocks[blocks.length-1].push(en);
        blocks.push([]);
      } else {
        blocks[blocks.length-1].push(en);
      }
    });
    blocks.forEach(function(b){ if(b.length) out.push(b.join(' ')); });
  });
  return out.join('\n\n');
}

function buildAll(){
  $$('#tabSeg button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === state.tab);
  });
  buildTypeBar();
  buildEditor();
  renderPreview();
}

/* 绑定 */
$$('#tabSeg button').forEach(function(b){
  b.addEventListener('click', function(){
    if(state.tab === b.dataset.tab) return;
    snapshot();
    state.tab = b.dataset.tab;
    save(); buildAll();
  });
});
$('#btnUndo').addEventListener('click', undo);
$('#btnReset').addEventListener('click', function(){
  snapshot();
  state.variants = {}; state.values = {}; state.skip = {};
  save(); buildAll(); toast('已清空');
});
$('#btnCopy').addEventListener('click', copyAll);
$('#btnCopy2').addEventListener('click', copyAll);

$('#fZh').addEventListener('change', function(){
  state.flags.zh = this.checked; save(); renderPreview();
});
$('#fLite').addEventListener('change', function(){
  state.flags.lite = this.checked; save(); renderPreview();
});
$('#fHl').addEventListener('change', function(){
  state.flags.hl = this.checked; save(); renderPreview();
});

/* 初始化 */
load();
$('#fZh').checked = !!state.flags.zh;
$('#fLite').checked = !!state.flags.lite;
$('#fHl').checked = !!state.flags.hl;
buildPresetSel();
buildAll();
updateUndoBtn();

/* 测试钩子（无副作用） */
window.__WB__ = {
  state: state,
  build: buildAll,
  undo: undo,
  save: save,
  __snap: snapshot,
  setType: function(t){ state.type = t; buildAll(); save(); },
  setSmall: function(t){ state.smallType = t; buildAll(); save(); },
  setTab: function(t){ state.tab = t; buildAll(); save(); },
  setPath: function(p){ state.path = p; buildAll(); save(); },
  setVal: setVal,
  getVal: getVal,
  variantOf: variantOf,
  sections: currentSections,
  renderText: renderText,
  renderHTML: renderHTML,
  applyPreset: function(i){ applyPreset(PRESETS[i]); },
  presets: PRESETS,
  slotDefs: slotDefs,
  copyText: collectText
};

})();

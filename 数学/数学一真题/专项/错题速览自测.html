const questions=[{"id": "01", "year": "2022 数二", "group": "📕 高数 · 大观严选题 / 组 1 · 有理函数与三角积分（不定积分计算）", "heading": "组 1 · 有理函数与三角积分（不定积分计算） · 01", "prompt": "计算 $\\displaystyle\\int_{0}^{1}\\frac{2x+3}{x^{2}-x+1}\\,dx$", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 01 · 2022 数二 · 分子一次除分母二次", "answer": "$\\boxed{\\dfrac{8\\sqrt3\\pi}{9}}$", "details": ""}, {"id": "03", "year": "2019 数二", "group": "📕 高数 · 大观严选题 / 组 1 · 有理函数与三角积分（不定积分计算）", "heading": "组 1 · 有理函数与三角积分（不定积分计算） · 03", "prompt": "计算 $\\displaystyle\\int\\frac{3x+6}{(x-1)^{2}(x^{2}+x+1)}\\,dx$", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 03 · 2019 数二 · 部分分式的分子次数", "answer": "", "details": "#数学/模块/高数 #数学/考点/有理函数积分 #数学/考点/部分分式 #数学/失分/K\n\n**来源**　大观严选题 · 积分章 · 2019 数二　｜　**卡点**　**K**（规则遗忘）\n\n**题**　计算 $\\displaystyle\\int\\frac{3x+6}{(x-1)^{2}(x^{2}+x+1)}\\,dx$\n\n**错因（尽兴原话）**　「**忘记了有理函数的积分、待定系数的确定 —— 只需要分子比分母括号里面低一次就行了。**」\n\n#### ① 知识点是什么\n\n**部分分式的分子次数规则**：**每个分式的分子，比它对应分母括号的次数低 1 次。**\n\n| 分母因式        | 次数             | 分子设成           | 依据                                                                |\n| ----------- | -------------- | -------------- | ----------------------------------------------------------------- |\n| $x-1$       | 1 次            | $A$（**常数**）    | 比 1 次低 1 次 ＝ 0 次                                                  |\n| $(x-1)^{2}$ | 2 次（**重因式**）   | $B$（**常数**）    | 重因式要**拆成 $k$ 项**：$\\frac{A}{x-1}+\\frac{B}{(x-1)^{2}}$，**每项分子都是常数** |\n| $x^{2}+x+1$ | 2 次（**不可约二次**） | $Cx+D$（**一次**） | 比 2 次低 1 次 ＝ 1 次                                                  |\n\n⇒ 本题应设：\n\n$\\frac{3x+6}{(x-1)^{2}(x^{2}+x+1)}=\\frac{A}{x-1}+\\frac{B}{(x-1)^{2}}+\\frac{Cx+D}{x^{2}+x+1}$\n\n#### ② 为什么错\n\n- **你的做法**：忘了「低 1 次」这条规则，**卡在\"不可约二次那项的分子该设什么\"** —— 是常数 $C$ 还是 $Cx+D$？\n- **正确做法**（5 步）：\n  1. **数分母有几种结构**：一次因子、它的平方、不可约二次 ⇒ **至少三项**\n  2. **按\"低 1 次\"设分子**：$A$、$B$、$Cx+D$\n  3. **通分写恒等式**：$A(x-1)(x^{2}+x+1)+B(x^{2}+x+1)+(Cx+D)(x-1)^{2}=3x+6$\n     > 用立方差省事：$(x-1)(x^{2}+x+1)=x^{3}-1$；$(x-1)^{2}=x^{2}-2x+1$\n  4. **比系数**（整理后 $x^{3},x^{2},x^{1},x^{0}$ 四个方程）：\n\n     $A+C=0,\\quad B+D-2C=0,\\quad B+C-2D=3,\\quad -A+B+D=6$\n  5. **解方程**：$\\Rightarrow A=-2,\\ B=3,\\ C=2,\\ D=1$\n- **差在哪**：**规则忘了** ⇒ 设错分子次数后，**方程组会少一个未知数自由度、根本解不出来**（不是解错，是无解）。这是\"一步设错、全题归零\"的位置。\n- **自检**：设完分子后**数一下未知数个数，应当与因式结构一一对应**（本题 4 个未知数 ↔ 1 个一次因子×1 ＋ 重因式×1 ＋ 不可约二次×2... 实为 4 个自由度）。\n\n#### ③ 出题人为什么这么出\n\n1. **分母故意给三种结构**（一次因子 ＋ 它的平方 ＋ 不可约二次）⇒ 一次考全部分分式规则，**少写一种就解不出**。\n2. **含不可约二次 $x^{2}+x+1$**（判别式 $=1-4<0$）⇒ 这是**唯一必须把分子设成一次**的地方，**专门用来区分\"真会\"和\"套模板\"**。\n3. **$(x-1)^{2}$ 用立方差化成 $x^{3}-1$** ⇒ 通分后展开不繁琐，**说明命题人想考的是\"设对分子次数\"，不是让你硬算**。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到                                  | 立刻做                                                                                             |\n| ----------------------------------- | ----------------------------------------------------------------------------------------------- |\n| 分母含**重因式** $(x-a)^{k}$              | **拆成 $k$ 项**（$\\frac{A_1}{x-a}+\\frac{A_2}{(x-a)^{2}}+\\cdots+\\frac{A_k}{(x-a)^{k}}$），**每项分子都是常数** |\n| 分母含**不可约二次** $x^{2}+px+q$（判别式 $<0$） | 分子设 **一次式 $Cx+D$** —— **不能只设常数**                                                                |\n| 分母是 $(x-a)(x^{2}+ax+a^{2})$         | 立刻用**立方差/立方和**化简（$=x^{3}\\pm a^{3}$）                                                             |\n| 设完部分分式                              | **数未知数个数**与因式自由度是否相符（不相符 ⇒ 一定设错了）                                                               |\n| 通分后                                 | 比系数（或代特殊值），**解出的应是一组确定值**；若方程不够 ⇒ 分子次数设错，回头改                                                    |\n\n**重做状态**（两个都不勾 = 未重做）\n\n- [ ] 已重做做对\n- [ ] 仍错 ⇒ 升级为顽固错题\n\n---"}, {"id": "04", "year": "1992 数二", "group": "📕 高数 · 大观严选题 / 组 1 · 有理函数与三角积分（不定积分计算）", "heading": "组 1 · 有理函数与三角积分（不定积分计算） · 04", "prompt": "计算 $\\displaystyle\\int_0^{\\pi}\\sqrt{1-\\sin x}\\,dx$", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 04 · 1992 数二 · 根号下 1-sinx 要凑平方", "answer": "$\\boxed{4(\\sqrt{2}-1)}$", "details": ""}, {"id": "05", "year": "1987 数二", "group": "📕 高数 · 大观严选题 / 组 1 · 有理函数与三角积分（不定积分计算）", "heading": "组 1 · 有理函数与三角积分（不定积分计算） · 05", "prompt": "计算 $\\displaystyle\\int\\frac{dx}{a^{2}\\sin^{2}x+b^{2}\\cos^{2}x}\\quad(a^{2}+b^{2}>0)$", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 05 · 1987 数二 · 分母为 sin²、cos² 的组合", "answer": "", "details": "#数学/模块/高数 #数学/考点/三角积分 #数学/考点/凑微分 #数学/失分/K\n\n**来源**　大观严选题 · 积分章 · 1987 数二（880 基础解答 3-6；张宇 1000 第九章基础 1-20）　｜　**卡点**　**K**（忘了\"同除\"）\n\n**题**　计算 $\\displaystyle\\int\\frac{dx}{a^{2}\\sin^{2}x+b^{2}\\cos^{2}x}\\quad(a^{2}+b^{2}>0)$\n\n**错因（尽兴原话）**　「**这题是忘了用同除来算了，其实一轮学的时候（会）。**」\n\n#### ① 知识点是什么\n\n- **分母是 $\\sin^{2}x$ 与 $\\cos^{2}x$ 的线性组合** ⇒ 固定起手式：**分子分母同除 $\\cos^{2}x$**，把分母整体变成 $\\tan x$ 的有理式，再凑 $d(\\tan x)$。\n- 因 $a^{2}+b^{2}>0$ ⇒ 需**分三种情况**讨论（这正是题目给参数 $a,b$ 的用意）。\n\n#### ② 为什么错\n\n- **你的情况**：**卡在\"从哪下手\"** —— 忘了\"同除\"这个起手式（一轮学过，忘了）。\n- **正确做法**（$a\\ne0,\\ b\\ne0$，4 步）：\n  1. **同除 $\\cos^{2}x$**：$\\displaystyle\\int\\frac{\\sec^{2}x\\,dx}{a^{2}\\tan^{2}x+b^{2}}$\n  2. **凑微分**：$\\sec^{2}x\\,dx=d(\\tan x)$；再令 $u=a\\tan x$ ⇒ $du=a\\sec^{2}x\\,dx$\n  3. **化成标准型**：$\\dfrac{1}{a}\\displaystyle\\int\\frac{du}{u^{2}+b^{2}}=\\dfrac{1}{ab}\\arctan\\dfrac{u}{b}+C$\n  4. **回代**：$\\dfrac{1}{ab}\\arctan\\dfrac{a\\tan x}{b}+C$\n- **另两种情况**（必须分开写）：\n  - $a=0,\\ b\\ne0$：$=\\dfrac{1}{b^{2}}\\displaystyle\\int\\sec^{2}x\\,dx=\\dfrac{\\tan x}{b^{2}}+C$\n  - $a\\ne0,\\ b=0$：$=\\dfrac{1}{a^{2}}\\displaystyle\\int\\csc^{2}x\\,dx=-\\dfrac{\\cot x}{a^{2}}+C$\n- **差在哪**：**忘了同除** ⇒ 分母混着 $\\sin$ 与 $\\cos$，凑不出微分。这是**标准手法缺失**，不是难。\n\n#### ③ 出题人为什么这么出\n\n1. **给参数 $a,b$ 就是为了考分类讨论**（$a=0$／$b=0$／都不为 0），漏一种就丢分。\n2. **分母写成 $\\sin^{2},\\cos^{2}$ 的组合是明示**：除 $\\cos^{2}$ 变 $\\tan$ 型。若分母是 $\\sin x\\cos x$，则是另一套手法（凑 $d(\\sin2x)$）。\n3. 结果 $\\dfrac{1}{ab}\\arctan\\dfrac{a\\tan x}{b}$ **结构对称** ⇒ 说明同除后恰好落进 $\\int\\frac{du}{u^{2}+b^{2}}$，是精心配的。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到                                                 | 立刻做 \n错因（红笔原话）　「这里实际上要加绝对值，因为不知道 $a$ 的正负」\n\n#### ① 知识点是什么\n\n- **部分分式**（分子凑 $2x+a-a$）：$\\dfrac{a}{x(2x+a)}=\\dfrac{1}{x}-\\dfrac{2}{2x+a}$\n- **含参量的 $\\ln$ 必须加绝对值**：$\\displaystyle\\int\\left(\\frac1x-\\frac{2}{2x+a}\\right)dx=\\ln\\left\\lvert\\frac{x}{2x+a}\\right\\rvert$\n- **反常积分要求被积函数在区间内无瑕点** ⇒ 若 $2x+a=0$ 的根落进 $[1,+\\infty)$，那点就是瑕点。\n\n#### ② 为什么错\n\n- **你的做法**：$\\displaystyle\\int_1^{+\\infty}\\left(\\frac1x-\\frac{2}{2x+a}\\right)dx=\\ln\\left\\lvert\\frac{x}{2x+a}\\right\\rvert\\Big|_1^{+\\infty}=\\ln\\frac12-\\ln\\left\\lvert\\frac{1}{2+a}\\right\\rvert=-\\ln2+\\ln\\lvert a+2\\rvert$\n\n  令 $=\\ln2$ ⇒ $\\lvert a+2\\rvert=4$ ⇒ $a=2$ **或** $a=-6$\n- **你只留了一个解** —— 漏的是\"**加了绝对值 ⇒ 方程是两个**\"这一层。\n- **还要回头排除**：$a=-6$ ⇒ $2x-6=0$ 在 $x=3\\in[1,+\\infty)$ ⇒ **$x=3$ 是瑕点** ⇒ $\\displaystyle\\int_1^{3}\\frac{dx}{x(2x-6)}$ 发散 ⇒ **$a=-6$ 不合题意**\n- ⇒ **$a=2$** ✓\n- **差在哪**：**缺情况**（绝对值 ⇒ 两解）＋ **缺回代验证**（忘了参数会造出新瑕点）。\n\n#### ③ 出题人为什么这么出\n\n1. **把 $a$ 放进分母**（$2x+a$）⇒ 逼你想两件事：**$\\ln$ 的绝对值** 和 **\"$a$ 会不会让分母为零\"** —— 一步填两个坑。\n2. **$a=-6$ 是精心配的**：它让根 $x=3$ 正好落在**积分区间内部**（而不是 $\\le1$ 的地方），所以**必须单独排掉**。\n3. **右端恰好 $=\\ln2$**（与 $\\lvert a+2\\rvert=4$ 配合）⇒ 答案干净。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到                      | 立刻做                                               |\n| ----------------------- | ------------------------------------------------- |\n| 积分结果含 $\\ln$ 且**参数符号未知** | **加绝对值** —— 且**绝对值 ⇒ 方程可能有两个解**，别只写一个             |\n| 含参反常积分                  | **解完参数回头验\"有没有造出新瑕点\"** —— 参数可能让分母在某点为零             |\n| 分母是 $x$ 与 $2x+a$ 这类     | **部分分式前先凑分子**（$2x+a-a$）⇒ $\\frac1x-\\frac{2}{2x+a}$ |\n| 积分限含 $+\\infty$          | 原函数先**合并成一个 $\\ln$ 再代限**（见 错题 02）                  |\n\n**重做状态**（两个都不勾 = 未重做）\n\n- [ ] 已重做做对\n- [ ] 仍错 ⇒ 升级为顽固错题\n\n---"}, {"id": "13", "year": "2026 数二三 13", "group": "📕 高数 · 大观严选题 / 组 2 · 反常积分判敛", "heading": "组 2 · 反常积分判敛 · 13", "prompt": "已知 $p$ 为实数，反常积分 $\\displaystyle\\int_0^{+\\infty}\\frac{\\arctan x}{x^{p}(1+x)}dx$ 收敛，则 $p$ 的取值范围为 \\____", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 13 · 2026 数二三 13 · $x\\to\\infty$ 忘了抓大头", "answer": "", "details": "#数学/模块/高数 #数学/考点/反常积分 #数学/考点/极限放缩 #数学/失分/M\n\n**来源**　**C**（真题互刷 · 数二三）· 2026 数二三 13（基础严选第五章选择 7）　｜　**考点**　反常积分两端判敛 · 抓大头　｜　**卡点**　**M**（**知道要放缩，忘了抓大头**）\n\n**题**　已知 $p$ 为实数，反常积分 $\\displaystyle\\int_0^{+\\infty}\\frac{\\arctan x}{x^{p}(1+x)}dx$ 收敛，则 $p$ 的取值范围为 \\____\n\n答案　$\\boxed{(0,\\ 2)}$\n\n错因（红笔原话）　「抓大头忘用了」（$x\\to+\\infty$ 那一端）\n\n#### ① 知识点是什么\n\n- **反常积分两端分别判，取交集**。\n- **$x\\to0$ 留最低次项；$x\\to+\\infty$ 留最高次项（抓大头）**。\n\n#### ② 为什么错\n\n- **你的卡点**：$x\\to+\\infty$ 时写到 $\\dfrac{1}{x^{p}+x^{1+p}}$ 就停住了 —— **没做\"抓大头\"**（$x^{p}$ 与 $x^{1+p}$ 谁大取决于 $p$ 的符号，必须分情况留最高次）。\n- **正确做法（两端各一步）**：\n  1. **$x\\to0$**：$\\arctan x\\sim x$ ⇒ 被积 $\\sim\\dfrac{x}{x^{p}\\cdot1}=\\dfrac{1}{x^{\\,p-1}}$ ⇒ 收敛 $\\iff p-1<1\\iff\\boxed{p<2}$\n  2. **$x\\to+\\infty$**：$\\arctan x\\to\\dfrac\\pi2$（**有界常数**）、$1+x\\sim x$ ⇒ **抓大头** ⇒ 被积 $\\sim\\dfrac{\\pi/2}{x^{\\,p+1}}$ ⇒ 收敛 $\\iff p+1>1\\iff\\boxed{p>0}$\n  3. **合并**：$0<p<2$\n- **差在哪**：**\"抓大头\"这一步没执行** ⇒ 卡在 $x^{p}+x^{1+p}$ 上出不来。\n\n#### ③ 出题人为什么这么出\n\n1. **分母写成 $x^{p}(1+x)$** ⇒ 两端各给一个 $\\alpha$：$x\\to0$ 看 $\\alpha=p$、$x\\to\\infty$ 看 $\\alpha=p+1$ —— **一题考两个端点**。\n2. **两个不等式方向相反**（$p<2$ 与 $p>0$）⇒ 必须**取交集**，漏一端就错。\n3. **$\\arctan x$ 是伪装**：$x\\to0$ 时它 $\\sim x$（提供一次幂）、$x\\to\\infty$ 时它是常数（不参与抓大头）—— **同一个函数在两个端点扮演不同角色**。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到                          | 立刻做                                     |\n| --------------------------- | --------------------------------------- |\n| $x\\to+\\infty$ 且分母是**幂次相加**  | **抓大头**：只留**最高次项** ⇒ 读出 $\\alpha$        |\n| $x\\to0$                     | 相反 —— 留**最低次项**                         |\n| $\\arctan x$ ／ $\\arcsin x$ 类 | $x\\to0$ 用 $\\sim x$；$x\\to\\infty$ 当**常数** |\n| 反常积分含参                      | **两端各判一次，最后取交集**                        |\n\n**重做状态**（两个都不勾 = 未重做）\n\n- [ ] 已重做做对\n- [ ] 仍错 ⇒ 升级为顽固错题\n\n---"}, {"id": "06", "year": "2019 数二", "group": "📕 高数 · 大观严选题 / 组 3 · 变限积分", "heading": "组 3 · 变限积分 · 06", "prompt": "已知函数 $f(x)=x\\displaystyle\\int_{1}^{x}\\frac{\\sin t^{2}}{t}\\,dt$，则 $\\displaystyle\\int_0^1 f(x)\\,dx=$", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 06 · 2019 数二 · 变限积分 + 分部（漏题干因子）", "answer": "$\\boxed{\\dfrac{1}{4}\\left(\\cos 1-1\\right)}$", "details": ""}, {"id": "07", "year": "2016 数二", "group": "📕 高数 · 大观严选题 / 组 3 · 变限积分", "heading": "组 3 · 变限积分 · 07", "prompt": "已知 $f(x)$ 在 $\\left[0,\\frac{3\\pi}2\\right]$ 上连续，在 $\\left(0,\\frac{3\\pi}2\\right)$ 内是函数 $\\dfrac{\\cos x}{2x-3\\pi}$ 的一个原函数，且 $f(0)=0$。　(I) 求 $f(x)$ 在 $\\left[0,\\frac{3\\pi}2\\right]$ 上的**平均值**；(II) 证明 $f(x)$ 在 $\\left(0,\\frac{3\\pi}2\\right)$ 内存在**唯一零点**。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 07 · 2016 数二 · 变限积分求平均值 ＋ 唯一零点", "answer": "(I) $\\boxed{\\dfrac{1}{3\\pi}}$", "details": ""}, {"id": "14", "year": "2013 数二", "group": "📕 高数 · 大观严选题 / 组 3 · 变限积分", "heading": "组 3 · 变限积分 · 14", "prompt": "设函数 $f(x)=\\begin{cases}\\sin x,&0\\le x<\\pi\\\\ 2,&\\pi\\le x\\le2\\pi\\end{cases}$，$F(x)=\\displaystyle\\int_0^{x}f(t)dt$，则（　）", "options": ["A. $x=\\pi$ 是 $F(x)$ 的跳跃间断点", "B. $x=\\pi$ 是 $F(x)$ 的可去间断点", "C. $F(x)$ 在 $x=\\pi$ 处连续但不可导", "D. $F(x)$ 在 $x=\\pi$ 处可导"], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 14 · 2013 数二 · 变限积分在跳跃点：连续但不可导", "answer": "**C**", "details": ""}, {"id": "18", "year": "1998 数一二", "group": "📕 高数 · 大观严选题 / 组 3 · 变限积分", "heading": "组 3 · 变限积分 · 18", "prompt": "设 $f(x)$ 连续，则 $\\dfrac{d}{dx}\\displaystyle\\int_0^{x}t\\,f(x^{2}-t^{2})dt=$ \\____", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 18 · 1998 数一二 · 变限积分换元：三换全做 ＋ 凑微分", "answer": "", "details": "#数学/模块/高数 #数学/考点/变限积分 #数学/考点/换元 #数学/失分/M\n\n**来源**　**A**（数一真题）· 1998 数一二（880 第三章基础填空 4）　｜　**考点**　变限积分换元 · **凑微分代替\"解出旧变量\"**　｜　**卡点**　**M**（**想到换元，但不知具体怎么做**）\n\n**题**　设 $f(x)$ 连续，则 $\\dfrac{d}{dx}\\displaystyle\\int_0^{x}t\\,f(x^{2}-t^{2})dt=$ \\____\n\n答案　$\\boxed{x\\,f(x^{2})}$\n\n错因（红笔原话）　「想到换元，但不知具体怎么做」；旁注「换元三换全部来一遍」；另写「看见 $tf(t)$ 直接凑」。\n\n#### ① 知识点是什么\n\n- **换元\"三换\"**：换**被积函数**、换**微分**（$dt\\to du$）、**换上下限** —— 三个都要动，**少一个就错**。\n- **凑微分（比换元更省）**：$t\\,dt=-\\dfrac12\\,d(x^{2}-t^{2})$ ⇒ 直接凑出 $d(x^{2}-t^{2})$，**不用真的\"解出 $t$\"**。\n- **变限积分求导**：$\\dfrac{d}{dx}\\displaystyle\\int_a^{g(x)}f=\\ f\\big(g(x)\\big)\\,g'(x)$ —— **别漏链式那个 $g'$**。\n\n#### ② 为什么错\n\n- **你的做法（红笔）**：走\"解出 $t$\"那条路 —— 令 $x^{2}-t^{2}=u$ 后写 $x^{2}=t^{2}+u$、$t=\\sqrt{t^{2}+u}$ … ⇒ **$t$ 根本解不干净，越算越乱**。\n- **正确做法（3 步）**：\n  1. **凑微分**：$\\displaystyle\\int_0^{x}t\\,f(x^{2}-t^{2})dt=\\boxed{-\\frac12\\int_0^{x}f(x^{2}-t^{2})\\,d\\!\\left(x^{2}-t^{2}\\right)}$\n  2. **换元 ＋ 换限**：令 $u=x^{2}-t^{2}$ ⇒ $t:0\\to x$ 对应 $u:x^{2}\\to0$ ⇒ $=\\dfrac12\\displaystyle\\int_0^{x^{2}}f(u)\\,du$\n  3. **求导**：$\\dfrac{d}{dx}\\left[\\dfrac12\\displaystyle\\int_0^{x^{2}}f(u)du\\right]=\\dfrac12 f(x^{2})\\cdot 2x=\\boxed{x f(x^{2})}$\n- **差在哪**：**没想到\"直接凑 $d(x^{2}-t^{2})$\"** ⇒ 卡在\"解不出 $t$\"这一步上出不来。\n\n#### ③ 出题人为什么这么出\n\n1. **$x^{2}-t^{2}$ 与 $t\\,dt$ 天然配对**（$d(x^{2}-t^{2})=-2t\\,dt$）⇒ **钥匙就摆在题面里**，考的是认不认得出来。\n2. **积分上限取 $x$、凑完变成 $x^{2}$** ⇒ 与 $d(x^2-t^2)$ 里的 $x^2$ 呼应 ⇒ 换限后直接落到 $\\int_0^{x^2}$。\n3. 结果 $x f(x^{2})$ **形式极简** ⇒ 说明套路（凑微分 → 换元换限 → 求导）走对就一步到位。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到                                             | 立刻做                                                                                       |\n| ---------------------------------------------- | ----------------------------------------------------------------------------------------- |\n| $\\displaystyle\\int_0^{x}t\\,f(x^{2}-t^{2})dt$ 型 | **凑 $d(x^{2}-t^{2})$**：$t\\,dt=-\\frac12 d(x^{2}-t^{2})$ ⇒ 化成 $\\frac12\\int_0^{x^{2}}f(u)du$ |\n| 要换元但**解不出旧变量**                                 | **别硬解** —— 用**凑微分**把 $dt$ 的系数直接塞进微分里                                                      |\n| 做换元                                            | **\"三换\"全做**：被积函数 ＋ 微分 ＋ **上下限**（**上下限最容易漏**）                                               |\n| 变限积分求导                                         | $\\dfrac{d}{dx}\\displaystyle\\int_a^{g(x)}f=f(g(x))\\,g'(x)$ —— **别忘了链式那个 $g'$**             |\n\n**重做状态**（两个都不勾 = 未重做）\n\n- [ ] 已重做做对\n- [ ] 仍错 ⇒ 升级为顽固错题\n\n---"}, {"id": "08", "year": "1987 数一", "group": "📕 高数 · 大观严选题 / 组 4 · 定积分的应用（面积）", "heading": "组 4 · 定积分的应用（面积） · 08", "prompt": "由曲线 $y=\\ln x$ 与两直线 $y=e+1-x$ 及 $y=0$ 所围成的平面图形的面积是 \\____", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 08 · 1987 数一 · 面积题先定区域", "answer": "", "details": "#数学/模块/高数 #数学/考点/平面图形面积 #数学/失分/R\n\n**来源**　大观严选题 · 面积节 · **1987 数一**（880 第三章基础填空 16；基础严选第六章填空 3）　｜　**卡点**　**R**（区域没定对）\n\n**题**　由曲线 $y=\\ln x$ 与两直线 $y=e+1-x$ 及 $y=0$ 所围成的平面图形的面积是 \\____\n\n答案　$\\boxed{\\dfrac32}$\n\n错因（蓝笔标注）　题旁写「区域」—— 标记这题的失分点在画图定区域。\n\n#### ① 知识点是什么\n\n- **求面积三步**：**① 画图 → ② 定区域（找交点、判断谁是上边界）→ ③ 定积分（必要时分段）**\n- 交点：$y=\\ln x$ 与 $y=e+1-x$ ⇒ $\\ln x+x=e+1$ ⇒ $\\boldsymbol{x=e}$（此时 $y=1$）；$y=e+1-x$ 与 $y=0$ ⇒ $x=e+1$；$y=\\ln x$ 与 $y=0$ ⇒ $x=1$。\n\n#### ② 为什么错\n\n- **你的标注「区域」** —— 本题的分水岭正是**画图定区域**：三条线围出的区域**不是一个整块**，必须**在 $x=e$ 处切开**（那里上下边界\"换手\"）。\n- **正确做法**：\n  1. **画图**，标出 $(1,0)$、$(e,1)$、$(e+1,0)$\n  2. **分段**：\n\n     $S=\\underbrace{\\int_1^e\\ln x\\,dx}_{[1,e]\\ \\text{上边界}=\\ln x}+\\underbrace{\\int_e^{e+1}(e+1-x)\\,dx}_{[e,e+1]\\ \\text{上边界}=e+1-x}$\n  3. **算**：$\\displaystyle\\int_1^e\\ln x\\,dx=\\big[x\\ln x-x\\big]_1^e=1$；$\\displaystyle\\int_e^{e+1}(e+1-x)dx=\\frac12$\n  4. ⇒ $S=1+\\dfrac12=\\boxed{\\dfrac32}$\n- **红笔的等价写法**：$S=\\dfrac12+\\displaystyle\\int_1^e\\lvert\\ln x\\rvert\\,dx=\\dfrac12+1=\\dfrac32$（同一个分段，只是把三角形那块先算出来）\n- **差在哪**：**区域没分对** —— 若当成\"整块三角形减曲线\"，或漏掉 $[e,e+1]$ 那一段，结果必错。\n\n#### ③ 出题人为什么这么出\n\n1. **一条曲线 ＋ 两条直线交叉** ⇒ 上下边界&#x4F1A;**\"换手\"** ⇒ **必须分段**。这是\"画图题\"的经典设伏。\n2. **交点 $x=e$ 选得巧**：$\\ln e=1$、$e+1-e=1$ —— 两线**恰好交在高度 1**，使 $[e,e+1]$ 那段化成简单三角形（面积 $\\frac12$）。\n3. **$\\int_1^e\\ln x\\,dx=1$ 是干净数** ⇒ 说明命题人只考**分段 + 基本积分**，不考计算技巧。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到                        | 立刻做                                     |\n| ------------------------- | --------------------------------------- |\n| 曲线 ＋ 两条直线围面积 \n\n**来源**　**C**（真题互刷 · 数三）· 2014 数三　｜　**考点**　累次积分 **两次换序** ⇒ 让不可积项相消　｜　**卡点**　**M**\n\n**题**　$\\displaystyle\\int_0^1\\!dy\\int_y^1\\left(\\frac{e^{x^2}}{x}-e^{y^2}\\right)dx=$ \\____\n\n答案　$\\boxed{\\dfrac12(e-1)}$\n\n红笔标注　「两次交换积分次序」\n\n#### ① 知识点是什么\n\n- **换序的作用**：① 把内层\"积不出来\"的项变成可积；② **制造可以相消的同类项**。\n- 本题两处不可积/难积：$\\dfrac{e^{x^2}}{x}$（原样积不出）与 $e^{y^2}$（原样积不出）。\n\n#### ② 为什么错（这题的巧劲在\"换**两次**\"）\n\n- **你的卡点**：我这题**没错**，这里只是收集一下，感觉很不错\n- **正确做法（两次换序 + 相消）**：\n  1. **第一次（整体换序）**：$\\displaystyle\\int_0^1\\!dy\\int_y^1(\\cdot)dx=\\int_0^1\\!dx\\int_0^x(\\cdot)dy$\n\n     $=\\int_0^1\\left[\\frac{e^{x^2}}{x}\\cdot x-\\int_0^xe^{y^2}dy\\right]dx=\\underbrace{\\int_0^1e^{x^2}dx}_{\\text{第一项被救活}}-\\underbrace{\\int_0^1\\!\\!dx\\!\\!\\int_0^xe^{y^2}dy}_{\\text{仍难积}}$\n\n     （**关键**：$\\frac{e^{x^2}}{x}$ 乘上 $\\int_0^xdy=x$ ⇒ $\\frac1x$ **约掉**）\n  2. **第二次（把后一项换回去）**：$\\displaystyle\\int_0^1\\!\\!dx\\!\\!\\int_0^xe^{y^2}dy=\\int_0^1e^{y^2}(1-y)dy=\\int_0^1e^{y^2}dy-\\int_0^1ye^{y^2}dy$\n  3. **相消**：$\\displaystyle\\int_0^1e^{x^2}dx$ 与 $\\displaystyle\\int_0^1e^{y^2}dy$ **添个负号正好抵消**，只剩 $\\displaystyle\\int_0^1ye^{y^2}dy$\n  4. **凑微分**：$\\displaystyle\\int_0^1ye^{y^2}dy=\\frac12e^{y^2}\\Big|_0^1=\\dfrac{e-1}{2}$ ✓\n- **差在哪**：**只换一次就停手** ⇒ 剩下的 $\\int e^{x^2}$ 无从下手；**\"换过去、再换回来\"才是这题的设计**。\n\n#### ③ 出题人为什么这么出\n\n1. **两项都设成\"原样积不出\"**（$e^{x^2}/x$ 与 $e^{y^2}$）⇒ 逼你换序 —— 但**换一次只能救活一项**。\n2. **$\\frac{e^{x^2}}{x}$ 与 $x$ 是配好的**：换序后 $\\int_0^xdy=x$ 把分母约掉 —— 这是\"第一次换序\"的奖励。\n3. **两项 $\\int_0^1e^{x^2}dx$ 与 $-\\int_0^1e^{y^2}dy$ 完全同形** ⇒ **只能靠\"第二次换序\"造出来相消** —— 全题的点睛之笔。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到                                            | 立刻做                               |\n| --------------------------------------------- | --------------------------------- |\n| 累次积分里**出现积不出的项**（$e^{x^2}$、$\\frac{\\sin x}x$…） | **先换序试试**；换一次不够就**再换一次**（换过去再换回来） |\n| 被积函数是 $\\frac{f(x^2)}{x}$ 配 $\\int dy$          | 换序后 $\\int_0^xdy=x$ ⇒ **分母约掉** ✓   |\n| 换序后出现**两项同形反号** 参数级数最后一定要\"**代入分界点判**\"。\n\n---"}, {"id": "86", "year": "2021 数一", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 86", "prompt": "设 $u_n(x)=e^{-nx}+\\dfrac{x^{n+1}}{n(n+1)}$（$n=1,2,\\cdots$），求级数 $\\displaystyle\\sum_{n=1}^{\\infty}u_n(x)$ 的收敛域及和函数。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 86 · 2021 数一 · 双部分和函数（**别漏端点 $x=1$**）", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**少了一种情况**」（红框里补的 $x=1$）\n\n**题**　设 $u_n(x)=e^{-nx}+\\dfrac{x^{n+1}}{n(n+1)}$（$n=1,2,\\cdots$），求级数 $\\displaystyle\\sum_{n=1}^{\\infty}u_n(x)$ 的收敛域及和函数。\n\n#### ① 拆成两个部分和\n\n$$S(x)=\\underbrace{\\sum_{n=1}^{\\infty}e^{-nx}}_{S_1}+\\underbrace{\\sum_{n=1}^{\\infty}\\frac{x^{n+1}}{n(n+1)}}_{S_2}$$\n\n#### ② $S_1$：几何级数\n\n$S_1(x)=\\dfrac{e^{-x}}{1-e^{-x}}=\\dfrac{1}{e^{x}-1}$，**收敛 $\\iff x>0$**。\n\n#### ③ $S_2$：收敛半径与端点\n\n$\\lim\\left\\lvert\\frac{a_{n+1}}{a_n}\\right\\rvert=\\lvert x\\rvert$ ⇒ $R=1$；**端点**：$x=\\pm1$ 时 $\\sum\\frac{(\\pm1)^{n+1}}{n(n+1)}$ 都收敛 ⇒ $S_2$ 的收敛域是 **$[-1,1]$**。\n\n#### ④ 取交集 ⇒ $(0,1]$\n\n⚠️ **$x=1$ 必须单独交代**（你补的那一条）：\n$$S_1(1)=\\frac{1}{e-1},\\qquad S_2(1)=\\sum_{n=1}^{\\infty}\\frac{1}{n(n+1)}=1\\ \\Longrightarrow\\ S(1)=\\frac{e}{e-1}$$\n\n#### ⑤ $S_2$ 的和函数（$x\\in[-1,1]$）\n\n$$S_2(x)=\\sum\\left(\\frac{x^{n+1}}{n}-\\frac{x^{n+1}}{n+1}\\right)=x\\sum_{n=1}^{\\infty}\\frac{x^{n}}{n}-\\sum_{n=1}^{\\infty}\\frac{x^{n+1}}{n+1}=x\\bigl(-\\ln(1-x)\\bigr)-\\bigl(-x-\\ln(1-x)\\bigr)$$\n（用 $\\sum_{n=1}^{\\infty}\\frac{x^{n}}{n}=-\\ln(1-x)$，$\\sum_{k=2}^{\\infty}\\frac{x^{k}}{k}=-x-\\ln(1-x)$）\n$$\\Longrightarrow\\ S_2(x)=(1-x)\\ln(1-x)+x$$\n\n#### ⑥ 合起来\n\n$$S(x)=\\frac{1}{e^{x}-1}+(1-x)\\ln(1-x)+x,\\qquad x\\in(0,1]$$\n\n> 💡 $x=1$ 时公式仍成立，因为 $\\lim_{x\\to1^{-}}(1-x)\\ln(1-x)=0$ ⇒ 自动给出 $S(1)=1$。**但你得先证明它包含在收敛域里**（这就是\"少了一种情况\"的意思）。\n\n---"}, {"id": "87", "year": "2001 北京竞赛", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 87", "prompt": "求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}n^{3}}{(n+1)!}x^{n}$ 的收敛域与和函数。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 87 · 2001 北京竞赛 · $\\sum\\frac{(-1)^{n}n^{3}}{(n+1)!}x^{n}$：**裂项拆成 $e^{-x}$**", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「故收敛域 $(-\\infty,+\\infty)$」\n\n**题**　求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}n^{3}}{(n+1)!}x^{n}$ 的收敛域与和函数。\n\n#### ① 收敛域\n\n$$\\lim_{n\\to\\infty}\\frac{(n+1)^{3}}{(n+2)!}\\cdot\\frac{(n+1)!}{n^{3}}=\\lim\\frac{(n+1)^{3}}{n^{3}(n+2)}=0\\ \\Longrightarrow\\ R=+\\infty$$\n\n⇒ **收敛域 $(-\\infty,+\\infty)$** ✓\n\n#### ② 拆 $n^{3}$（关键代数）\n\n$$n^{3}=(n+1)(n^{2}-n+1)-1\\ \\Longrightarrow\\ \\frac{n^{3}}{(n+1)!}=\\frac{n^{2}-n+1}{n!}-\\frac{1}{(n+1)!}$$\n\n⇒ 原级数 $=\\underbrace{\\sum_{n=1}^{\\infty}\\frac{(-x)^{n}}{n!}}_{S_{2}}-\\underbrace{\\sum_{n=1}^{\\infty}\\frac{(-x)^{n}}{(n+1)!}}_{S_{3}}+\\underbrace{\\sum_{n=2}^{\\infty}\\frac{(-x)^{n}}{(n-2)!}}_{S_{1}}$\n\n#### ③ 三个部分和\n\n- $S_{1}=x^{2}\\sum_{n=2}^{\\infty}\\frac{(-x)^{n-2}}{(n-2)!}=x^{2}e^{-x}$\n- $S_{2}=e^{-x}-1$\n- $S_{3}=\\sum_{n=1}^{\\infty}\\frac{(-x)^{n}}{(n+1)!}=-\\frac{1}{x}\\sum_{k=2}^{\\infty}\\frac{(-x)^{k}}{k!}=-\\frac{1}{x}\\bigl(e^{-x}-1+x\\bigr)$\n\n$$S=S_{1}+S_{2}-S_{3}=\\Bigl(x^{2}+1+\\frac{1}{x}\\Bigr)e^{-x}-\\frac{1}{x}\\qquad(x\\ne0);\\qquad S(0)=0$$\n\n> ✅ **验算**（$x=1$）：级数逐项和 $\\approx0.1038$；公式 $(1+1+1)e^{-1}-1=0.1036$ ✓\n\n---"}, {"id": "88", "year": "姜真题同源 150（第八章 A17）", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 88", "prompt": "设 $a_n=\\displaystyle\\int_0^{1}x^{2}(1-x)^{n}dx$（$n=1,2,\\cdots$），求 $\\displaystyle\\sum_{n=1}^{\\infty}a_n$。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 88 · 姜真题同源 150（第八章 A17）· $a_n=\\int_0^1x^{2}(1-x)^{n}dx$ 求和", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**换元**」\n\n**题**　设 $a_n=\\displaystyle\\int_0^{1}x^{2}(1-x)^{n}dx$（$n=1,2,\\cdots$），求 $\\displaystyle\\sum_{n=1}^{\\infty}a_n$。\n\n#### 法一 · 换元后逐项求（你的标注）\n\n$1-x=t\\Rightarrow x=1-t$，$dx=-dt$：\n$$a_n=\\int_0^{1}(1-t)^{2}t^{n}dt=\\int_0^{1}\\left(t^{n}-2t^{n+1}+t^{n+2}\\right)dt=\\frac{1}{n+1}-\\frac{2}{n+2}+\\frac{1}{n+3}$$\n\n$$\\sum_{n=1}^{N}a_n=\\left(\\sum\\frac{1}{n+1}-\\sum\\frac{1}{n+2}\\right)-\\left(\\sum\\frac{1}{n+2}-\\sum\\frac{1}{n+3}\\right)\\to\\left(\\frac12-\\frac13\\right)=\\frac{1}{6}$$\n\n#### 法二 · 先交换求和与积分（更漂亮）\n\n$$\\sum_{n=1}^{\\infty}a_n=\\int_0^{1}x^{2}\\sum_{n=1}^{\\infty}(1-x)^{n}dx=\\int_0^{1}x^{2}\\cdot\\frac{1-x}{x}dx=\\int_0^{1}x(1-x)dx=\\frac12-\\frac13=\\frac16$$\n\n---"}, {"id": "89", "year": "1999 数一", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 89", "prompt": "设 $a_n=\\displaystyle\\int_0^{\\pi/4}\\tan^{n}x\\,dx$。　(Ⅰ) 求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n}(a_n+a_{n+2})$ 的值；　(Ⅱ) 试证：对任意的常数 $\\lambda>0$，级数 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{a_n}{n^{\\lambda}}$ 收敛。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 89 · 1999 数一 · $a_n=\\int_0^{\\pi/4}\\tan^{n}x\\,dx$", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**难想，是换元 ＋ 放缩，把积分给算出来**」；「$\\tan x$ **换成 $t$**」\n\n**题**　设 $a_n=\\displaystyle\\int_0^{\\pi/4}\\tan^{n}x\\,dx$。\n(Ⅰ) 求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n}(a_n+a_{n+2})$ 的值；(Ⅱ) 试证：对任意的常数 $\\lambda>0$，级数 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{a_n}{n^{\\lambda}}$ 收敛。\n\n#### (Ⅰ) 凑微分把积分算出来\n\n$$a_n+a_{n+2}=\\int_0^{\\pi/4}\\tan^{n}x\\left(1+\\tan^{2}x\\right)dx=\\int_0^{\\pi/4}\\tan^{n}x\\,d(\\tan x)=\\frac{\\tan^{n+1}x}{n+1}\\Bigg|_0^{\\pi/4}=\\frac{1}{n+1}$$\n$$\\Longrightarrow\\ \\sum_{n=1}^{\\infty}\\frac{1}{n}(a_n+a_{n+2})=\\sum_{n=1}^{\\infty}\\frac{1}{n(n+1)}=\\mathbf 1$$\n\n#### (Ⅱ) 换元 ＋ 放缩\n\n$\\tan x=t$ ⇒ $\\displaystyle a_n=\\int_0^{1}\\frac{t^{n}}{1+t^{2}}dt\\le\\int_0^{1}t^{n}dt=\\frac{1}{n+1}$\n$$\\Longrightarrow\\ \\frac{a_n}{n^{\\lambda}}\\le\\frac{1}{(n+1)n^{\\lambda}}\\sim\\frac{1}{n^{\\lambda+1}}$$\n⇒ $\\sum\\frac{1}{n^{\\lambda+1}}$ 收敛（$\\lambda+1>1$）⇒ 原级数**收敛** ✓\n\n> ⭐ **\"$\\int_0^{\\pi/4}$ 上的 $\\tan^n$\" ⇒ 换元 $t=\\tan x$**，把三角函数积分变成**幂函数的积分**，再用 $\\frac{1}{1+t^{2}}\\le1$ 放缩。\n\n---"}, {"id": "90", "year": "2024 数一三", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 90", "prompt": "设幂级数 $\\displaystyle\\sum_{n=0}^{\\infty}a_nx^{n}$ 的和函数为 $\\ln(2+x)$，则 $\\displaystyle\\sum_{n=0}^{\\infty}na_{2n}=$（　）", "options": ["A. $-\\dfrac{1}{6}$", "B. $-\\dfrac{1}{3}$", "C. $\\dfrac{1}{6}$", "D. $\\dfrac{1}{3}$"], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 90 · 2024 数一三 · 由和函数反求系数", "answer": "**A**（$-\\frac{1}{6}$）", "details": ""}, {"id": "91", "year": "2001 数一", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 91", "prompt": "设 $f(x)=\\begin{cases}\\left(\\frac{1}{x^{2}}+x\\right)\\arctan x, & x\\ne0\\\\[4pt] 1, & x=0\\end{cases}$，试将 $f(x)$ 展开成 $x$ 的幂级数，并求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{1-4n^{2}}$。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 91 · 2001 数一（严选第七章 34）· **首项分离 ＋ 拼凑 $x^{2n}$**", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**首项分离，拼凑构成 $x^{2n}$**」；「$f(1)=1+2A=\\frac{\\pi}{2}$」\n\n**题**　设 $f(x)=\\begin{cases}\\left(\\frac{1}{x^{2}}+x\\right)\\arctan x, & x\\ne0\\\\[4pt] 1, & x=0\\end{cases}$，试将 $f(x)$ 展开成 $x$ 的幂级数，并求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{1-4n^{2}}$。\n\n#### ① 代入 $\\arctan x$ 的展开式\n\n$$\\arctan x=\\sum_{n=0}^{\\infty}\\frac{(-1)^{n}x^{2n+1}}{2n+1}\\qquad(\\lvert x\\rvert\\le1)$$\n$$\\left(\\frac{1}{x^{2}}+x\\right)\\arctan x=\\sum_{n=0}^{\\infty}\\frac{(-1)^{n}x^{2n-1}}{2n+1}+\\sum_{n=0}^{\\infty}\\frac{(-1)^{n}x^{2n+2}}{2n+1}$$\n\n#### ② **首项分离** ＋ 拼成 $x^{2n}$\n\n把第一和的 $n=0$ 项（$=\\frac{1}{x}$）与第二和的 $n=0$ 项（$=x^{2}$ 那支）单独拿出来，再把两边**都改写成 $x^{2n}$ 的幂、合并同类项**：\n\n$$f(x)=1+2\\sum_{n=1}^{\\infty}\\frac{(-1)^{n}}{1-4n^{2}}\\,x^{2n}\\qquad(\\lvert x\\rvert\\le1)$$\n\n（**合并时用 $\\frac{1}{2n+1}+\\frac{1}{2n-1}=\\frac{4n}{1-4n^{2}}\\cdot(-1)$ 这类通分**，正是\"拼凑 $x^{2n}$\"的意思。）\n\n#### ③ 用 $x=1$ 求那个数项级数\n\n$f(1)=\\left(\\frac{1}{1}+1\\right)\\arctan1=2\\cdot\\frac{\\pi}{4}=\\frac{\\pi}{2}$，而由展开式 $f(1)=1+2A$（$A=\\sum\\frac{(-1)^{n}}{1-4n^{2}}$）：\n$$1+2A=\\frac{\\pi}{2}\\ \\Longrightarrow\\ A=\\frac{\\pi}{4}-\\frac{1}{2}$$\n\n> ⭐ **套路**：先展成幂级数 ⇒ 再**代端点值** ⇒ **反求某个数项级数的和**。（$x=1$ 处级数收敛才敢代。）\n\n---"}, {"id": "92", "year": "2018 数三", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 92", "prompt": "已知 $\\cos2x-\\dfrac{1}{(1+x)^{2}}=\\displaystyle\\sum_{n=0}^{\\infty}a_nx^{n}$（$-1<x<1$），求 $a_n$。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 92 · 2018 数三 · $\\cos2x-\\frac{1}{(1+x)^{2}}$：**讨论奇偶**", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**讨论奇偶**」\n\n**题**　已知 $\\cos2x-\\dfrac{1}{(1+x)^{2}}=\\displaystyle\\sum_{n=0}^{\\infty}a_nx^{n}$（$-1<x<1$），求 $a_n$。\n\n#### ① 两个标准展开\n\n$$\\cos2x=\\sum_{k=0}^{\\infty}\\frac{(-1)^{k}(2x)^{2k}}{(2k)!}=\\sum_{k=0}^{\\infty}\\frac{(-1)^{k}4^{k}}{(2k)!}x^{2k}\\qquad(\\textbf{只有偶次项})$$\n$$\\frac{1}{(1+x)^{2}}=\\sum_{n=0}^{\\infty}(-1)^{n}(n+1)x^{n}\\qquad(\\textbf{全次项})$$\n\n#### ② 逐项相减，按奇偶分\n\n- **$n$ 为奇数**：$\\cos2x$ 贡献 $0$ ⇒\n$$a_n=-(-1)^{n}(n+1)=n+1$$\n- **$n$ 为偶数**（记 $n=2k$）：\n$$a_{2k}=\\frac{(-1)^{k}4^{k}}{(2k)!}-(2k+1)$$\n\n#### ③ 合并写法\n\n$$\\begin{cases}a_{2n}=\\dfrac{(-1)^{n}4^{n}}{(2n)!}-(2n+1), & n=0,1,2,\\cdots\\\\[6pt] a_{2n+1}=2n+2\\end{cases}$$\n\n> ⚠️ **易错**：忘记 $\\cos2x$ **只贡献偶次项** ⇒ 奇数项算错；或漏掉 $(-1)^{n}$ —— **先验 $a_0=1-1=0$** 最省事。\n\n---"}, {"id": "93", "year": "1991 数一", "group": "📕 高数 · 大观严选题 / 组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶）", "heading": "组 17 · 幂级数（收敛半径 ／ 求和 ／ 展开 ／ 傅里叶） · 93", "prompt": "将函数 $f(x)=2+\\lvert x\\rvert$（$-1\\le x\\le1$）展开成以 $2$ 为周期的傅里叶级数，并由此求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^{2}}$。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 93 · 1991 数一（严选第七章 48）· $2+\\lvert x\\rvert$ 的傅里叶级数", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「$f(x)$ 为**偶函数**」\n\n**题**　将函数 $f(x)=2+\\lvert x\\rvert$（$-1\\le x\\le1$）展开成以 $2$ 为周期的傅里叶级数，并由此求 $\\displaystyle\\sum_{n=1}^{\\infty}\\frac{1}{n^{2}}$。\n\n#### ① 偶函数 ⇒ 只算 $a_0,a_n$（$b_n=0$），$l=1$\n\n$$a_0=\\frac{2}{T}\\int_{-1}^{1}f(x)\\,dx=\\int_{-1}^{1}(2+\\lvert x\\rvert)dx=2\\int_0^{1}(2+x)dx=\\mathbf 5$$\n\n$$a_n=2\\int_0^{1}(2+x)\\cos n\\pi x\\,dx=4\\underbrace{\\int_0^1\\cos n\\pi x\\,dx}_{=0}+2\\int_0^1x\\cos n\\pi x\\,dx=\\frac{2}{n^{2}\\pi^{2}}(\\cos n\\pi-1)$$\n\n$$\\Longrightarrow\\ a_n=\\begin{cases}0, & n=2k\\\\[4pt] -\\dfrac{4}{n^{2}\\pi^{2}}, & n=2k-1\\end{cases}$$\n\n#### ② 级数\n\n$$f(x)\\sim\\frac{5}{2}-\\frac{4}{\\pi^{2}}\\sum_{k=1}^{\\infty}\\frac{\\cos(2k-1)\\pi x}{(2k-1)^{2}}$$\n\n#### ③ 代 $x=0$ 求 $\\sum\\frac{1}{(2k-1)^{2}}$\n\n$f(0)=2$ ⇒ $2=\\dfrac52-\\dfrac{4}{\\pi^{2}}\\sum_{k=1}^{\\infty}\\dfrac{1}{(2k-1)^{2}}$ ⇒\n$$\\sum_{k=1}^{\\infty}\\frac{1}{(2k-1)^{2}}=\\frac{\\pi^{2}}{8}$$\n\n#### ④ 拆成奇、偶两半求 $\\sum\\frac{1}{n^{2}}$\n\n$$\\sum_{n=1}^{\\infty}\\frac{1}{n^{2}}=\\sum_{k=1}^{\\infty}\\frac{1}{(2k-1)^{2}}+\\sum_{k=1}^{\\infty}\\frac{1}{(2k)^{2}}=\\frac{\\pi^{2}}{8}+\\frac14\\sum_{n=1}^{\\infty}\\frac{1}{n^{2}}$$\n$$\\Longrightarrow\\ \\frac34\\sum_{n=1}^{\\infty}\\frac{1}{n^{2}}=\\frac{\\pi^{2}}{8}\\ \\Longrightarrow\\ \\sum_{n=1}^{\\infty}\\frac{1}{n^{2}}=\\frac{\\pi^{2}}{6}$$\n\n---"}, {"id": "94", "year": "2017 数三", "group": "📕 高数 · 大观严选题 / 组 18 · 级数与数列（递推 × 压缩）", "heading": "组 18 · 级数与数列（递推 × 压缩） · 94", "prompt": "若 $a_0=1$，$a_1=1$，$a_{n+1}=\\dfrac{1}{n+1}(na_n+a_{n-1})$（$n=1,2,\\cdots$），$S(x)$ 为幂级数 $\\sum a_nx^{n}$ 的和函数。　(Ⅰ) 证 $\\sum a_nx^{n}$ 的**收敛半径不小于 1**；　(Ⅱ) 证 $(1-x)S'-xS=0$（$x\\in(-1,1)$），并求 $S(x)$。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 94 · 2017 数三（880 拓展 1）· 递推 ⇒ 收敛半径 ＋ 和函数", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**第一问的证明方法**」\n\n**题**　若 $a_0=1$，$a_1=1$，$a_{n+1}=\\dfrac{1}{n+1}(na_n+a_{n-1})$（$n=1,2,\\cdots$），$S(x)$ 为幂级数 $\\sum a_nx^{n}$ 的和函数。\n(Ⅰ) 证 $\\sum a_nx^{n}$ 的**收敛半径不小于 1**；(Ⅱ) 证 $(1-x)S'-xS=0$（$x\\in(-1,1)$），并求 $S(x)$。\n\n#### (Ⅰ) **归纳法证\"系数有界\"**（你要的方法）\n\n$a_0=a_1=1$。设 $\\lvert a_k\\rvert\\le1$（$k\\le n$）：\n$$\\lvert a_{n+1}\\rvert\\le\\frac{1}{n+1}\\bigl(n\\lvert a_n\\rvert+\\lvert a_{n-1}\\rvert\\bigr)\\le\\frac{n+1}{n+1}=1$$\n⇒ $\\lvert a_n\\rvert\\le1$ ⇒ $\\limsup\\sqrt[n]{\\lvert a_n\\rvert}\\le1$ ⇒ **$R\\ge1$** ✓\n\n> ⭐ **\"证收敛半径 ≥ 某数\"的标准姿势**：**归纳证系数有界 $\\lvert a_n\\rvert\\le M$** ⇒ $R=1/\\limsup\\sqrt[n]{\\lvert a_n\\rvert}\\ge1$。\n\n#### (Ⅱ) 微分方程\n\n$$S'(x)=\\sum_{n=1}^{\\infty}na_nx^{n-1}\\ \\Longrightarrow\\ (1-x)S'(x)=\\sum_{n=0}^{\\infty}\\bigl[(n+1)a_{n+1}-na_n\\bigr]x^{n}$$\n由递推 $(n+1)a_{n+1}-na_n=a_{n-1}$ ⇒ $(1-x)S'(x)=\\sum_{n=1}^{\\infty}a_{n-1}x^{n}=xS(x)$\n$$\\Longrightarrow\\ (1-x)S'(x)-xS(x)=0$$\n\n解之：$\\dfrac{S'}{S}=\\dfrac{x}{1-x}=-1+\\dfrac{1}{1-x}$ ⇒ $\\ln S=-x-\\ln(1-x)+C$ ⇒ $S=\\dfrac{Ce^{-x}}{1-x}$。\n由 $S(0)=a_0=1$ ⇒ $C=1$：\n$$S(x)=\\frac{e^{-x}}{1-x},\\qquad x\\in(-1,1)$$\n\n---"}, {"id": "95", "year": "2005 北京竞赛", "group": "📕 高数 · 大观严选题 / 组 18 · 级数与数列（递推 × 压缩）", "heading": "组 18 · 级数与数列（递推 × 压缩） · 95", "prompt": "设 $a_0=1$，$na_n=\\left[\\frac12+(n-1)\\right]a_{n-1}$（$n=1,2,\\cdots$）。证明：当 $\\lvert x\\rvert<1$ 时幂级数 $\\sum a_nx^{n}$ 收敛，并求其和函数。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 95 · 2005 北京竞赛（严选第七章 38）· 比值 → 显式 → 幂级方程", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**幂级[数]方程**」；「**构造**」\n\n**题**　设 $a_0=1$，$na_n=\\left[\\frac12+(n-1)\\right]a_{n-1}$（$n=1,2,\\cdots$）。证明：当 $\\lvert x\\rvert<1$ 时幂级数 $\\sum a_nx^{n}$ 收敛，并求其和函数。\n\n#### ① 比值判敛\n\n$$\\frac{a_n}{a_{n-1}}=\\frac{n-\\frac12}{n}=\\frac{2n-1}{2n}\\ \\longrightarrow\\ 1\\ \\Longrightarrow\\ R=1$$\n⇒ $\\lvert x\\rvert<1$ 时收敛 ✓（顺便写出显式：$a_n=\\dfrac{1\\cdot3\\cdot5\\cdots(2n-1)}{2\\cdot4\\cdots2n}$）\n\n#### ② **构造**幂级数方程\n\n把递推改写：$2na_n=(2n-1)a_{n-1}$。对其乘 $x^{n-1}$ 求和（$n\\ge1$）：\n$$\\underbrace{\\sum_{n\\ge1}2na_nx^{n-1}}_{2S'(x)}=\\underbrace{\\sum_{n\\ge1}(2n-1)a_{n-1}x^{n-1}}_{2xS'(x)+S(x)}$$\n（右边令 $k=n-1$：$\\sum_{k\\ge0}(2k+1)a_kx^{k}=2xS'(x)+S(x)$）\n\n⇒ $2S'=2xS'+S$ ⇒ $(2-2x)S'=S$ ⇒ $\\dfrac{S'}{S}=\\dfrac{1}{2(1-x)}$\n⇒ $\\ln S=-\\dfrac12\\ln(1-x)+C$ ⇒ $S=C(1-x)^{-1/2}$，由 $S(0)=1$ ⇒ $C=1$：\n$$S(x)=\\frac{1}{\\sqrt{1-x}},\\qquad \\lvert x\\rvert<1$$\n\n---"}, {"id": "96", "year": "1992 北京竞赛", "group": "📕 高数 · 大观严选题 / 组 18 · 级数与数列（递推 × 压缩）", "heading": "组 18 · 级数与数列（递推 × 压缩） · 96", "prompt": "设 $f(x)=\\dfrac{1}{1-x-x^{2}}$，$a_n=\\dfrac{f^{(n)}(0)}{n!}$（$n=0,1,\\cdots$）。证明：　(Ⅰ) $a_{n+2}=a_{n+1}+a_n$；　(Ⅱ) 级数 $\\displaystyle\\sum_{n=0}^{\\infty}\\frac{a_{n+1}}{a_na_{n+2}}$ 收敛，并求其值。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 96 · 1992 北京竞赛（例 7.6）· 分母是多项式 ⇒ **移项构造**", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**📝 你的标注**　「**分母是多项式：移项构造**」；「$a_n$ 构成**斐波那契数列**」；「$\\sum=2-\\frac{1}{a_{n+1}}-\\frac{1}{a_{n+2}}\\to2$」\n\n**题**　（第四届北京市大学生数学竞赛，1992 年）设 $f(x)=\\dfrac{1}{1-x-x^{2}}$，$a_n=\\dfrac{f^{(n)}(0)}{n!}$（$n=0,1,\\cdots$）。证明：\n(Ⅰ) $a_{n+2}=a_{n+1}+a_n$；(Ⅱ) 级数 $\\displaystyle\\sum_{n=0}^{\\infty}\\frac{a_{n+1}}{a_na_{n+2}}$ 收敛，并求其值。\n\n#### (Ⅰ) **移项构造**：$f\\cdot(1-x-x^{2})=1$，再两边求 $n+2$ 阶导\n\n$$f(x)(1-x-x^{2})=1$$\n\n对 $x$ 求 $n+2$ 阶导（$n\\ge0$），用**莱布尼茨公式**：\n$$f^{(n+2)}-(n+2)f^{(n+1)}-(n+2)(n+1)f^{(n)}=0$$\n（$(xf)^{(n+2)}=xf^{(n+2)}+(n+2)f^{(n+1)}$；$(x^{2}f)^{(n+2)}=x^{2}f^{(n+2)}+2(n+2)xf^{(n+1)}+(n+2)(n+1)f^{(n)}$，代 $x=0$ 即得。）\n\n两边除以 $(n+2)!$：\n$$\\underbrace{\\frac{f^{(n+2)}(0)}{(n+2)!}}_{a_{n+2}}-\\underbrace{\\frac{f^{(n+1)}(0)}{(n+1)!}}_{a_{n+1}}-\\underbrace{\\frac{f^{(n)}(0)}{n!}}_{a_n}=0\\ \\Longrightarrow\\ \\boxed{a_{n+2}=a_{n+1}+a_n}$$\n\n（$a_0=f(0)=1$，$a_1=f'(0)=1$ ⇒ 正是**斐波那契数列**：$1,1,2,3,5,8,\\cdots$）\n\n#### (Ⅱ) **裂项** ＋ 望远镜\n\n$$\\frac{a_{n+1}}{a_na_{n+2}}=\\frac{a_{n+2}-a_n}{a_na_{n+2}}=\\frac{1}{a_n}-\\frac{1}{a_{n+2}}$$\n$$\\sum_{n=0}^{N}=\\left(\\frac1{a_0}-\\frac1{a_2}\\right)+\\left(\\frac1{a_1}-\\frac1{a_3}\\right)+\\left(\\frac1{a_2}-\\frac1{a_4}\\right)+\\cdots=1+1-\\frac{1}{a_{N+1}}-\\frac{1}{a_{N+2}}$$\n（正负项**错位相消**，中间剩首两项与末两项）\n由 $a_n\\to+\\infty$ ⇒ $\\frac{1}{a_{N+1}},\\frac{1}{a_{N+2}}\\to0$ ⇒\n$$\\sum_{n=0}^{\\infty}\\frac{a_{n+1}}{a_na_{n+2}}=\\mathbf 2$$\n\n> ⭐ **两个通用动作**：① 分母是**多项式** ⇒ **移项构造** $f\\cdot P=1$，两边求高阶导；② 递推出 $a_{n+2}=a_{n+1}+a_n$ 后，$\\frac{a_{n+1}}{a_na_{n+2}}$ 这种**一定要裂项**。\n\n---"}, {"id": "97", "year": "2016 数一", "group": "📕 高数 · 大观严选题 / 组 18 · 级数与数列（递推 × 压缩）", "heading": "组 18 · 级数与数列（递推 × 压缩） · 97", "prompt": "已知函数 $f(x)$ 可导，且 $f(0)=1$，$0<f'(x)<\\dfrac12$。设数列 $\\{x_n\\}$ 满足 $x_{n+1}=f(x_n)$（$n=1,2,\\cdots$）。证明：　(Ⅰ) 级数 $\\displaystyle\\sum_{n=1}^{\\infty}(x_{n+1}-x_n)$ 绝对收敛；　(Ⅱ) $\\displaystyle\\lim_{n\\to\\infty}x_n$ 存在，且 $0<\\displaystyle\\lim_{n\\to\\infty}x_n<2$。", "options": [], "link": "../高数·大观严选题错题精选（A·数一高频）.md#错题 97 · 2016 数一 · 压缩映射 ⇒ $\\sum(x_{n+1}-x_n)$ 绝对收敛", "answer": "", "details": "#数学/模块/高数 #数学/考点/级数 #数学/失分/M\n\n\n**题**　已知函数 $f(x)$ 可导，且 $f(0)=1$，$0<f'(x)<\\dfrac12$。设数列 $\\{x_n\\}$ 满足 $x_{n+1}=f(x_n)$（$n=1,2,\\cdots$）。证明：\n(Ⅰ) 级数 $\\displaystyle\\sum_{n=1}^{\\infty}(x_{n+1}-x_n)$ 绝对收敛；(Ⅱ) $\\displaystyle\\lim_{n\\to\\infty}x_n$ 存在，且 $0<\\displaystyle\\lim_{n\\to\\infty}x_n<2$。\n\n#### (Ⅰ) **拉格朗日压缩** ＋ 比几何级数\n\n$$\\lvert x_{n+1}-x_n\\rvert=\\lvert f(x_n)-f(x_{n-1})\\rvert=\\lvert f'(\\xi)\\rvert\\,\\lvert x_n-x_{n-1}\\rvert<\\frac12\\lvert x_n-x_{n-1}\\rvert$$\n递推下去：\n$$\\lvert x_{n+1}-x_n\\rvert<\\frac{1}{2^{n-1}}\\lvert x_2-x_1\\rvert$$\n$$\\Longrightarrow\\ \\sum_{n=1}^{\\infty}\\lvert x_{n+1}-x_n\\rvert\\le\\lvert x_2-x_1\\rvert\\sum_{n=1}^{\\infty}\\frac{1}{2^{n-1}}=2\\lvert x_2-x_1\\rvert<+\\infty$$\n⇒ **绝对收敛** ✓\n\n#### (Ⅱ) 收敛 ＋ 夹出极限范围\n\n- **收敛**：$\\sum(x_{n+1}-x_n)$ 收敛 ⇒ 其部分和 $x_{N}-x_1$ 有极限 ⇒ $\\{x_n\\}$ 收敛 ✓\n- **定范围**：令 $g(x)=f(x)-x$，$g'(x)=f'(x)-1<0$ ⇒ $g$ **严格单调减**；\n  $$g(0)=f(0)-0=1>0,\\qquad g(2)=f(2)-2=\\bigl[f(0)+2f'(\\xi)\\bigr]-2<1+1-2=0$$\n  ⇒ 由**零点定理**，$g$ 在 $(0,2)$ 内**恰有一个零点** $a$ ⇒ $f(a)=a$。\n- 由 "D. $A-B$ 只有一个线性无关的特征向量"], "link": "../线代·分类书错题精选.md#线代 03 · 2026 数二 10 · 幂零矩阵与特征向量个数", "answer": "**D**", "details": ""}, {"id": "05", "year": "1996 年八题", "group": "📗 线代 · 分类书 / 组 4 · 特殊矩阵与特征值", "heading": "组 4 · 特殊矩阵与特征值 · 05", "prompt": "设 $A=E-\\xi\\xi^{T}$，其中 $E$ 是 $n$ 阶单位矩阵，$\\xi$ 是 $n$ 维**非零**列向量，$\\xi^{T}$ 是 $\\xi$ 的转置，证明：　(1) $A^{2}=A$ 的**充要条件**是 $\\xi^{T}\\xi=1$；　(2) 当 $\\xi^{T}\\xi=1$ 时，$A$ 是**不可逆**矩阵。", "options": [], "link": "../线代·分类书错题精选.md#线代 05 · 1996 年八题 · 幂等矩阵的特征值只有 0 或 1", "answer": "", "details": "#数学/模块/线性代数 #数学/考点/特征值 #数学/考点/幂等矩阵 #数学/失分/K\n\n**来源**　**A**（数一真题 · 早年精选）· **1996 年八题**　｜　**考点**　幂等矩阵 · 特征值「0 **或** 1」的解读　｜　**卡点**　**K**（把\"或\"读成了信息不足，反去解 $\\xi^{T}\\xi$）\n> ⚠️ **题号更正（2026-09-23）**：原写作「1987 年三(2)」，据笔记本原页更正 —— **1987 年三(2) 是另一道题**（$AB=aA+bB$ 型，见 线代 06），本条的 $A=E-\\xi\\xi^{T}$ 是 **1996 年八题**。\n**题**　设 $A=E-\\xi\\xi^{T}$，其中 $E$ 是 $n$ 阶单位矩阵，$\\xi$ 是 $n$ 维**非零**列向量，$\\xi^{T}$ 是 $\\xi$ 的转置，证明：\n(1) $A^{2}=A$ 的**充要条件**是 $\\xi^{T}\\xi=1$；\n(2) 当 $\\xi^{T}\\xi=1$ 时，$A$ 是**不可逆**矩阵。\n**错因（尽兴原话）**　「**特征值证明不了 ⇒ 特征值是必要条件**」（红笔）。\n> 具体症状：想**用 $A^{2}=A$ 去反解 $\\xi^{T}\\xi$**，结果卡死在循环论证上。\n\n#### ① 知识点是什么\n\n- **$E-\\xi\\xi^{T}$ 的特征值**：$\\xi\\xi^{T}$ 是**秩 1 矩阵**，特征值为 $\\xi^{T}\\xi$（1 个）与 $0$（$n-1$ 个）⇒ $E-\\xi\\xi^{T}$ 的特征值为\n$$\\underbrace{1-\\xi^{T}\\xi}_{\\text{1 个}},\\quad\\underbrace{1,\\ \\dots,\\ 1}_{n-1\\ \\text{个}}$$\n- **矩阵式 vs 特征值式**（这题的关键是认清两者**不平行**）：\n\n| 层面 | 式子 | 用法 |\n| --- | --- | --- |\n| 矩阵式 | $A^{2}=A$ | 用来做**恒等变形**（展开、提公因子） |\n| 特征值式 | $\\lambda^{2}=\\lambda$ ⇒ $\\lambda\\in\\{0,1\\}$ | 用来**判可逆 / 定特征值** |\n\n#### ② 为什么错\n\n- **你卡住的点**：想通过 $A^{2}=A$ **反解** $\\xi^{T}\\xi=1$ —— 但\n  $$A^{2}=E-2\\xi\\xi^{T}+\\xi(\\xi^{T}\\xi)\\xi^{T}=E-(2-\\xi^{T}\\xi)\\xi\\xi^{T}$$\n  要它 $=A=E-\\xi\\xi^{T}$，**必须** $(2-\\xi^{T}\\xi)=1$ 即 $\\xi^{T}\\xi=1$ —— **这正是要证的东西** ⇒ **循环论证**。\n- **正确做法**（**直接算特征值，绕开矩阵式**）：\n  1. $\\xi\\xi^{T}$ 特征值 $\\xi^{T}\\xi$、$0,\\dots,0$ ⇒ $A=E-\\xi\\xi^{T}$ 特征值 $1-\\xi^{T}\\xi$、$1,\\dots,1$\n  2. $\\lvert A\\rvert=(1-\\xi^{T}\\xi)\\cdot1^{n-1}=1-\\xi^{T}\\xi$\n  3. $\\xi^{T}\\xi=1$ ⇒ $\\lvert A\\rvert=0$ ⇒ **$A$ 不可逆** ✓\n- **一句话诊断**：**\"$A^{2}=A$ ⇒ 特征值 0 或 1\"是必要条件，不是充分条件** —— 它只说\"只能是这两个值\"，**说不出\"每个值出现几次\"**；而\"出现几次\"由**秩**决定，与 $\\xi^{T}\\xi$ 是否等于 1 有关。**想用它反推秩 / 反解参数，方向就错了。**\n\n#### ③ 出题人为什么这么出\n\n1. **$A$ 的形状 $E-\\xi\\xi^{T}$ 是\"投影/反射\"型**（秩 1 修正）⇒ 特征值**几乎白送**（只需知道 $\\xi\\xi^{T}$ 的特征值）。\n2. **故意让你从 $A^{2}=A$ 入手**：等式干净、展开也不难，但**展开后必然出现 $\\xi^{T}\\xi$，然后卡在恒等式上** —— 这是设计好的\"岔路\"，逼你回头走特征值。\n3. **两问层层递进**：(1) 定出 $\\xi^{T}\\xi=1$ 这个条件，(2) 用它算 $\\lvert A\\rvert=0$ —— **命题人希望你用\"行列式＝特征值之积\"一步跨过去**。\n\n#### ④ 操作手法 · 条件反射\n\n| 见到 | 立刻做 |\n| --- | --- |\n| **$A^{2}=A$** | 特征值 **$\\in\\{0,1\\}$（\"或\"）** —— **只给取值范围，不给个数** |\n| **$A^{k}=O$** | 特征值**全为 0**（\"全\"）—— 与幂等相反，别记混 |\n| 要判 $A$ 可逆 | **算 $\\lvert A\\rvert$**：$\\lvert A\\rvert=\\prod\\lambda_i$ —— **一个零特征值就够判不可逆** |\n| 形状是 $E-\\xi\\xi^{T}$ / $E-k\\xi\\xi^{T}$ | $\\xi\\xi^{T}$ 特征值 $\\xi^{T}\\xi$ 与 $0$ ⇒ **整体特征值立刻写出** |\n| 想用矩阵等式**反解**参数 | **停** —— 先问\"这个等式是不是依赖我要证的结论\"（本题就是循环论证） |\n\n**重做状态**（两个都不勾 = 未重做）\n- [ ] 已重做做对\n- [ ] 仍错 ⇒ 升级为顽固错题\n\n---"}, {"id": "09", "year": "1992 年九题", "group": "📗 线代 · 分类书 / 组 4 · 特殊矩阵与特征值", "heading": "组 4 · 特殊矩阵与特征值 · 09", "prompt": "设 3 阶矩阵 $A$ 的特征值为 $\\lambda_1=1$、$\\lambda_2=2$、$\\lambda_3=3$，对应的特征向量依次为　$\\xi_1=\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix},\\quad \\xi_2=\\begin{pmatrix}1\\\\2\\\\4\\end{pmatrix},\\quad \\xi_3=\\begin{pmatrix}1\\\\3\\\\9\\end{pmatrix},\\qquad \\beta=\\begin{pmatrix}1\\\\1\\\\3\\end{pmatrix}$　(1) 将 $\\beta$ 用 $\\xi_1,\\xi_2,\\xi_3$ 线性表示；(2) 求 $A^{n}\\beta$（$n$ 为自然数）。", "options": [], "link": "../线代·分类书错题精选.md#线代 09 · 1992 年九题 · 求 $A^{n}\\beta$ 忘了 $\\lambda^{n}$", "answer": "(1) $\\beta=2\\xi_1-2\\xi_2+\\xi_3$；(2) $\\boxed{A^{n}\\beta=2\\xi_1-2^{\\,n+1}\\xi_2+3^{\\,n}\\xi_3}$", "details": ""}, {"id": "11", "year": "2020 数一 21", "group": "📗 线代 · 分类书 / 组 4 · 特殊矩阵与特征值", "heading": "组 4 · 特殊矩阵与特征值 · 11", "prompt": "设矩阵 $A$ 为 2 阶矩阵，$P=(\\alpha,A\\alpha)$，其中 $\\alpha$ 是非零向量且不是 $A$ 的特征向量。(1)
